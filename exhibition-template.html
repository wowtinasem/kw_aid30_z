<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ★ 페이지 제목·설명을 프로젝트에 맞게 수정하세요 -->
<title>작품 전시관 — 템플릿</title>
<meta name="description" content="전시관 템플릿 — 히어로 섹션 + 갤러리 형식">
<!-- ★ 파비콘: 같은 폴더에 favicon.png 를 두거나 경로를 수정하세요 (없으면 이 줄 삭제) -->
<link rel="icon" type="image/png" href="favicon.png">
<!-- ★ 오픈그래프: 배포 주소가 정해지면 아래 6줄의 주소·문구를 수정하세요 -->
<!--
<meta property="og:type" content="website">
<meta property="og:url" content="https://YOUR-DOMAIN/">
<meta property="og:title" content="전시관 제목">
<meta property="og:description" content="전시관 소개 한 줄">
<meta property="og:image" content="https://YOUR-DOMAIN/og.png">
<meta name="twitter:card" content="summary_large_image">
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   전시관 템플릿 — 히어로 섹션 + 갤러리 (공공기관 스타일)
   남색 주조 · 절제된 구성 · 전시 도록형 작품 카드

   ▶ 내용(기관명·문구·작품)은 <script> 상단의 SITE / CATEGORIES /
     ITEMS 만 수정하면 됩니다. HTML·CSS는 건드릴 필요 없습니다.
   ▶ 주조색을 바꾸려면 아래 :root 변수만 수정하세요.
============================================================ */
:root{
  --navy:#1B3A6B;        /* 주조색 (기관 남색) */
  --navy-deep:#12294E;   /* 주조색 어두운 톤 (상단바·푸터) */
  --navy-tint:#EEF2F8;   /* 주조색 옅은 톤 (표 라벨 배경) */
  --blue:#2E75B6;        /* 포인트색 */
  --hero-bg:#0E1D3A;     /* 히어로 배경 */
  --bg:#F5F7FA;
  --paper:#FFFFFF;
  --ink:#22303F;
  --muted:#5C6B7A;
  --line:#D8DFE8;
  --gold:#B08A2E;
  --radius:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Noto Sans KR",-apple-system,"Malgun Gothic",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}

/* ---------- 기관 표시줄 ---------- */
.gov-bar{
  background:var(--navy-deep);color:#fff;
  font-size:13px;letter-spacing:.04em;
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 24px;
}
.gov-bar .org{font-weight:700}
.gov-bar .org img{
  height:48px;width:auto;display:block;
  background:#fff;padding:5px 12px;border-radius:6px;
}
.gov-bar .prog{color:#B9C8DE;font-size:25px}

/* ---------- 히어로 ---------- */
.hero{
  position:relative;overflow:hidden;
  background:var(--hero-bg);
  padding:34px 24px 30px;text-align:center;
}
/* 무대 배경: 점 격자 + 빔 스윕 */
.stage{position:absolute;inset:0;z-index:1;pointer-events:none}
.grid-dots{
  position:absolute;inset:0;
  background-image:radial-gradient(rgba(140,180,255,.20) 1px, transparent 1.4px);
  background-size:26px 26px;
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,.3));
  mask-image:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,.3));
}
.beam{
  position:absolute;top:-45%;height:190%;width:32vw;min-width:300px;left:50%;
  background:linear-gradient(90deg,transparent,
    rgba(90,160,255,.30) 45%, rgba(94,234,212,.18) 58%, transparent);
  filter:blur(36px);
  mix-blend-mode:screen;
  animation:sweep 28s linear infinite;
}
.beam.b2{width:14vw;min-width:160px;opacity:.65;animation-delay:-14s}
@keyframes sweep{
  from{transform:translateX(-92vw) rotate(14deg)}
  to  {transform:translateX(92vw)  rotate(14deg)}
}
.hero-inner{
  position:relative;z-index:2;
  max-width:1080px;margin:0 auto;
  display:grid;grid-template-columns:1.08fr .92fr;
  align-items:center;gap:44px;
  text-align:left;
}
.hero-copy{min-width:0}
/* ---------- 글래스 연꽃 + 디지털 닷 스피어 ---------- */
.lotus-wrap{position:relative;display:flex;justify-content:center;align-items:flex-end}
.globe{
  position:absolute;left:50%;top:46%;
  width:380px;height:380px;max-width:none;
  transform:translate(-50%,-50%);
  pointer-events:none;opacity:.9;
}
.lotus{z-index:1}
.lotus{
  position:relative;width:330px;height:255px;
  --ls:.8;transform-origin:bottom center;
  animation:floatY 8s ease-in-out 2s infinite;
}
.lotus::before{ /* 후광 */
  content:"";position:absolute;left:50%;top:52%;width:300px;height:300px;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(94,234,212,.16) 0%,rgba(90,160,255,.10) 45%,transparent 70%);
  filter:blur(6px);
}
.petal{
  position:absolute;left:50%;bottom:52px;
  transform-origin:50% 100%;
  border:1px solid rgba(185,220,255,.38);
  background:linear-gradient(180deg,rgba(205,230,255,.16) 0%,rgba(255,255,255,.03) 70%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28), inset 0 -8px 22px rgba(90,160,255,.08);
  border-radius:50% 50% 46% 46% / 78% 78% 24% 24%;
  /* 반복 개화(5초 주기): 피어남(1s) → 만개 유지(약 3s) → 오므림 → 다시 개화 */
  --r:0deg; --d:.8s; --po:1;
  opacity:0;
  animation:bloomLoop 5s ease-in-out infinite;
  animation-delay:var(--d);
}
@keyframes bloomLoop{
  0%{transform:rotate(calc(var(--r) * .12)) scale(.5,.3);opacity:0}
  12%{opacity:var(--po)}
  20%,80%{transform:rotate(var(--r)) scale(1,1);opacity:var(--po)}
  93%,100%{transform:rotate(calc(var(--r) * .12)) scale(.5,.3);opacity:0}
}
.pb{width:84px;height:138px;margin-left:-42px;--po:.75}
.p1{--r:-52deg;--d:.75s} .p2{--r:-19deg;--d:.95s}
.p3{--r:19deg;--d:.95s}  .p4{--r:52deg;--d:.75s}
.pf{
  width:96px;height:186px;margin-left:-48px;
  background:linear-gradient(180deg,rgba(215,238,255,.22) 0%,rgba(255,255,255,.05) 72%);
  border-color:rgba(205,235,255,.5);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -10px 26px rgba(94,234,212,.10),
             0 10px 34px rgba(8,18,40,.35);
}
.p5{--r:-26deg;--d:1.15s;height:168px}
.p6{--r:0deg;--d:1.35s}
.p7{--r:26deg;--d:1.15s;height:168px}
.core{
  position:absolute;left:50%;bottom:64px;width:26px;height:26px;
  margin-left:-13px;border-radius:50%;
  background:radial-gradient(circle,#8CF3DF 0%,#5EEAD4 45%,rgba(94,234,212,0) 75%);
  filter:blur(1px);
  opacity:0;
  animation:coreLoop 5s ease-in-out infinite;
  animation-delay:1.35s;
}
@keyframes coreLoop{
  0%,17%{opacity:0;transform:scale(.2)}
  26%{opacity:.75;transform:scale(1)}
  50%{opacity:1;transform:scale(1.16)}
  78%{opacity:.75;transform:scale(1)}
  91%,100%{opacity:0;transform:scale(.2)}
}
.ripple{
  position:absolute;left:50%;border:1px solid rgba(150,195,255,.28);
  border-radius:50%;transform:translateX(-50%) scaleY(.32);
  opacity:0;--o:1;
  animation:rippleIn 1s 2s ease both;
}
@keyframes rippleIn{to{opacity:var(--o)}}
.r1{bottom:22px;width:220px;height:52px}
.r2{bottom:12px;width:300px;height:64px;--o:.5}
.hero-eyebrow{
  display:inline-block;font-size:13px;font-weight:700;letter-spacing:.24em;
  color:#7FB8FF;margin-bottom:10px;
}
.hero h1{
  font-size:clamp(26px,4.2vw,40px);font-weight:900;letter-spacing:-.015em;
  line-height:1.3;color:#FFFFFF;margin-bottom:10px;
  text-shadow:0 0 34px rgba(80,150,255,.30);
}
/* 키네틱 등장(1회) */
.w{display:inline-block;opacity:0;transform:translateY(26px);
  animation:rise .7s cubic-bezier(.2,.7,.3,1) both}
.fx{opacity:0;transform:translateY(14px);
  animation:rise .6s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
/* 그라데이션 글자 + 빛 훑기(시머) 반복 */
.hero h1 .glow{
  background:linear-gradient(110deg,#7FB8FF 18%,#5EEAD4 38%,#EAF6FF 50%,#5EEAD4 62%,#7FB8FF 82%);
  background-size:230% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:rise .7s .36s cubic-bezier(.2,.7,.3,1) both,
            shimmer 7s ease-in-out 1.6s infinite;
}
@keyframes shimmer{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
.hero-sub{
  font-size:clamp(14px,1.7vw,16.5px);color:#B9C8DE;
  max-width:560px;
}
.hero-sub b{color:#FFFFFF;font-weight:700}
/* 글래스 프롬프트 카드 */
.prompt-line{
  max-width:520px;margin:18px 0 0;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(160,200,255,.28);
  border-radius:14px;
  padding:14px 20px;text-align:left;
  font-size:clamp(14px,1.8vw,16.5px);color:#EAF2FF;
  box-shadow:0 8px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.16);
  display:flex;align-items:center;gap:10px;
  opacity:0;
  animation:rise .6s .8s cubic-bezier(.2,.7,.3,1) both,
            floatY 6s ease-in-out 1.8s infinite;
}
@keyframes floatY{0%,100%{transform:translateY(0) scale(var(--ls,1))}50%{transform:translateY(-6px) scale(var(--ls,1))}}
.prompt-line .mark{color:#5EEAD4;font-weight:900}
.caret{
  display:inline-block;width:2px;height:1.15em;background:#7FB8FF;
  margin-left:2px;animation:blink 1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}

/* ---------- 작품 전시 영역 배경 ---------- */
.works{
  background:
    radial-gradient(rgba(27,58,107,.055) 1px, transparent 1.4px),
    linear-gradient(180deg,#D9E4F2 0%,#E6EDF6 55%,#F0F4FA 100%);
  background-size:26px 26px, 100% 100%;
  border-bottom:1px solid var(--line);
}

/* ---------- 필터 ---------- */
.toolbar{
  max-width:1280px;margin:0 auto;
  padding:24px 24px 4px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.section-title{font-size:19px;font-weight:900;color:var(--navy);letter-spacing:-.01em}
.section-title small{display:block;font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:.02em;margin-top:2px}
.filters{display:flex;gap:6px}
.filter-btn{
  border:1px solid var(--line);background:var(--paper);color:var(--muted);
  font-size:13.5px;font-weight:500;padding:8px 20px;border-radius:6px;
  transition:all .15s ease;
}
.filter-btn:hover{border-color:var(--blue);color:var(--blue)}
.filter-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}

/* ---------- 갤러리 (4열 × N줄) ---------- */
.grid{
  max-width:1280px;margin:0 auto;padding:18px 24px 70px;
  display:grid;gap:18px;
  grid-template-columns:repeat(4,1fr);
}
@media (max-width:1020px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.card{
  background:var(--paper);border:1px solid #CBD7E6;border-radius:var(--radius);
  overflow:hidden;text-align:left;display:flex;flex-direction:column;
  box-shadow:0 3px 12px rgba(18,41,78,.07);
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(18,41,78,.16);border-color:#A8BCD6}
.card:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.thumb{
  aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;
  font-size:52px;position:relative;overflow:hidden;
}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .badge{
  position:absolute;top:12px;right:12px;
  background:rgba(255,255,255,.92);color:var(--navy);
  font-size:11px;font-weight:700;letter-spacing:.1em;
  padding:4px 10px;border-radius:4px;
}
.label{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column;gap:4px}
.label h3{font-size:16px;font-weight:700;line-height:1.4;color:var(--ink)}
.label .byline{font-size:13px;color:var(--muted)}
.label .meta-row{margin-top:10px;display:flex;align-items:center;gap:8px}
.chip{font-size:11.5px;font-weight:700;padding:3px 11px;border-radius:4px}
.label .open-hint{margin-left:auto;font-size:12.5px;color:var(--blue);font-weight:500}

/* ---------- 도록형 작품 카드 (모달) ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(14,26,46,.6);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:50;
}
.overlay.show{display:flex;animation:fadeIn .18s ease}
.placard{
  background:var(--paper);border-radius:10px;max-width:600px;width:100%;
  max-height:90vh;overflow:auto;
  box-shadow:0 28px 80px rgba(0,0,0,.32);
  animation:placardIn .26s cubic-bezier(.2,.85,.3,1.1);
}
.placard-head{
  background:var(--navy);color:#fff;
  padding:14px 26px;display:flex;justify-content:space-between;align-items:center;
}
.placard-head .no{font-size:13px;font-weight:700;letter-spacing:.18em;color:#D8C48A}
.placard-head .div{font-size:12.5px;font-weight:700;letter-spacing:.08em;color:#B9C8DE}
.placard .thumb{aspect-ratio:16/7;font-size:60px}
.placard-body{padding:26px 30px 30px}
.placard h2{
  font-size:24px;font-weight:900;color:var(--navy);
  letter-spacing:-.01em;line-height:1.35;margin-bottom:4px;
}
.placard .artist{font-size:14.5px;color:var(--muted);margin-bottom:20px}
.placard .artist b{color:var(--ink)}
.spec{border-top:2px solid var(--navy);margin-bottom:24px}
.spec-row{
  display:grid;grid-template-columns:96px 1fr;
  border-bottom:1px solid var(--line);
}
.spec-row dt{
  background:var(--navy-tint);color:var(--navy);
  font-size:13px;font-weight:700;letter-spacing:.06em;
  padding:13px 14px;display:flex;align-items:flex-start;
}
.spec-row dd{font-size:14.5px;color:var(--ink);padding:13px 16px;white-space:pre-line}
.placard-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  border:none;border-radius:6px;font-size:15px;font-weight:700;
  padding:14px 24px;transition:all .15s ease;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn-go{background:var(--navy);color:#fff;flex:1;min-width:180px}
.btn-go:hover{background:var(--navy-deep)}
.btn-go.disabled{background:#AEB9C7;cursor:not-allowed}
.btn-close{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn-close:hover{border-color:var(--muted);color:var(--ink)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes placardIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}

/* ---------- 푸터 ---------- */
footer{
  background:var(--navy-deep);color:#B9C8DE;
  padding:30px 24px;text-align:center;font-size:13px;line-height:1.9;
}
footer .org{color:#fff;font-weight:700;font-size:14px}

/* 전시용 페이지: OS '동작 줄이기' 설정과 무관하게 연출을 항상 재생합니다 */
@media (max-width:900px){
  .hero-inner{grid-template-columns:1fr;text-align:center;gap:10px}
  .hero-sub{margin:0 auto}
  .prompt-line{margin:24px auto 0}
  .lotus-wrap{margin-top:26px}
  .lotus{transform:scale(.72);transform-origin:bottom center;margin-bottom:-30px;
    animation:none}
  .globe{width:340px;height:340px}
}
@media (max-width:680px){
  .toolbar{justify-content:center;text-align:center}
  .spec-row{grid-template-columns:82px 1fr}
}
</style>
</head>
<body>

<!-- ================= 기관 표시줄 ================= -->
<div class="gov-bar">
  <span class="org" id="orgSlot"></span>
  <span class="prog" id="progSlot"></span>
</div>

<!-- ================= 히어로 ================= -->
<header class="hero">
  <div class="stage" aria-hidden="true">
    <div class="grid-dots"></div>
    <div class="beam b1"></div>
    <div class="beam b2"></div>
  </div>
  <div class="hero-inner">
    <div class="hero-copy">
      <span class="hero-eyebrow fx" style="animation-delay:.02s" id="eyebrowSlot"></span>
      <h1 id="titleSlot"></h1>
      <p class="hero-sub fx" style="animation-delay:.55s" id="subSlot"></p>
      <div class="prompt-line" aria-hidden="true"><span class="mark">＞</span><span id="typeText"></span><span class="caret"></span></div>
    </div>
    <div class="lotus-wrap fx" style="animation-delay:.7s" aria-hidden="true">
      <canvas class="globe" id="globe"></canvas>
      <div class="lotus">
        <span class="ripple r2"></span><span class="ripple r1"></span>
        <i class="petal pb p1"></i><i class="petal pb p2"></i><i class="petal pb p3"></i><i class="petal pb p4"></i>
        <i class="petal pf p5"></i><i class="petal pf p7"></i><i class="petal pf p6"></i>
        <b class="core"></b>
      </div>
    </div>
  </div>
</header>

<!-- ================= 작품 전시 영역 ================= -->
<section class="works">
<div class="toolbar">
  <div class="section-title" id="sectionTitleSlot"></div>
  <div class="filters" id="filters" role="tablist" aria-label="부문 필터"></div>
</div>
<main class="grid" id="grid" aria-live="polite"></main>
</section>

<!-- ================= 도록형 작품 카드 ================= -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <article class="placard">
    <div class="placard-head">
      <span class="no" id="pNo"></span>
      <span class="div" id="pDiv"></span>
    </div>
    <div class="thumb" id="pThumb"><span id="pEmoji"></span></div>
    <div class="placard-body">
      <h2 id="pTitle"></h2>
      <p class="artist" id="pArtist"></p>
      <dl class="spec">
        <div class="spec-row"><dt id="specLabel1"></dt><dd id="pTopic"></dd></div>
        <div class="spec-row"><dt id="specLabel2"></dt><dd id="pUsage"></dd></div>
      </dl>
      <div class="placard-actions">
        <a class="btn btn-go" id="pGo" target="_blank" rel="noopener"></a>
        <button class="btn btn-close" id="pClose">닫기</button>
      </div>
    </div>
  </article>
</div>

<!-- ================= 푸터 ================= -->
<footer id="footerSlot"></footer>

<script>
/* ============================================================
   ★★★ 여기부터가 수정 구역입니다 — SITE / CATEGORIES / ITEMS ★★★
   아래 세 덩어리만 프로젝트에 맞게 바꾸면 전시관이 완성됩니다.
============================================================ */

/* ---------- ① 사이트 기본 정보 ---------- */
const SITE = {
  /* 상단 표시줄 */
  orgName: "기관·단체 이름",                  // 예: "충청남도부여교육지원청"
  orgLogo: "",                               // 로고 이미지 경로. "" 이면 orgName 텍스트로 표시
  programName: "행사·프로그램 이름",           // 오른쪽 상단 문구

  /* 히어로 섹션 */
  eyebrow: "전시관 상단 작은 제목",            // 예: "교원AI 수업역량 강화 연수 성과 전시관"
  titleWords: ["전시관", "큰제목"],            // 한 단어씩 순서대로 떠오릅니다
  titleGlow: "강조 제목",                     // 둘째 줄, 그라데이션+시머 효과
  subHTML: "전시관 소개 문장입니다. <b>강조</b>는 b 태그를 쓰세요.",
  prompts: [                                 // 프롬프트 카드에 타이핑되는 문구들
    "첫 번째 타이핑 문구",
    "두 번째 타이핑 문구",
  ],

  /* 작품 목록 헤더 */
  sectionTitle: "작품 목록",
  sectionHint: "작품을 선택하면 소개 카드가 열립니다",

  /* 작품 번호·라벨 형식 */
  badge: n => `작품 제${String(n).padStart(2,"0")}호`,   // 카드 왼쪽 배지·모달 머리띠
  artistLine: item => `이 앱은 <b>${item.group} ${item.author} 선생님</b>의 작품입니다.`,
  specLabel1: "작품 주제",
  specLabel2: "사용 방법",
  goText: "앱 바로가기 ↗",
  noUrlText: "앱 주소 준비 중",

  /* 푸터 (한 줄씩 배열로) */
  footerLines: [
    "<span class='org'>기관·단체 이름</span>",
    "본 전시관 소개 문장 첫째 줄.",
    "본 전시관 소개 문장 둘째 줄.",
  ],

  /* 자동 전시 모드: 무조작 40초 → 작품 카드 자동 순환 (url 있는 작품만) */
  idleMs: 40000, showMs: 6500, gapMs: 900,
};

/* ---------- ② 부문(필터) — 필요한 만큼 추가·삭제 ---------- */
const CATEGORIES = [
  { key:"초등", label:"초등부", color:"#2E75B6", tint:"#E8F1F9" },
  { key:"중등", label:"중등부", color:"#2F7D5B", tint:"#E9F4EE" },
];

/* ---------- ③ 작품 목록 ----------
   group    : 소속 (학교·부서·팀 이름)
   author   : 만든 사람 이름
   category : CATEGORIES 의 key 중 하나 (필터에 사용)
   title    : 작품 이름
   topic    : 작품 주제 1~2문장
   usage    : 사용 방법. 줄바꿈은 \n
   url      : 작품 주소. "" 이면 버튼이 '준비 중'으로 표시되고
              자동 전시 순환에서도 제외됩니다
   emoji    : 이미지가 없을 때 카드에 표시할 이모지 1개
   image    : 썸네일 이미지 주소(권장: 해당 앱의 OG 이미지). "" 이면 자동 색상 카드
   ※ 4열 그리드이므로 총 개수를 4의 배수로 맞추면 줄이 딱 떨어집니다.
   ※ 빈 자리는 대기 카드(아래 마지막 항목 형식)로 채워 두세요.            */
const ITEMS = [
  { group:"소속 이름", author:"작가 이름", category:"초등", title:"작품 제목 예시",
    topic:"작품이 무엇을 하는지 1~2문장으로 소개합니다.",
    usage:"① 첫 번째 사용 단계\n② 두 번째 사용 단계\n③ 세 번째 사용 단계",
    url:"https://example.com", emoji:"🎨", image:"" },
  { group:"소속 이름", author:"작가 이름", category:"중등", title:"작품 제목 예시 2",
    topic:"작품이 무엇을 하는지 1~2문장으로 소개합니다.",
    usage:"① 첫 번째 사용 단계\n② 두 번째 사용 단계",
    url:"", emoji:"🧩", image:"" },
  { group:"ooo", author:"ooo", category:"초등", title:"새로운 앱을 연결해주세요.",
    topic:"새로운 작품이 곧 이 자리에 연결될 예정입니다.",
    usage:"작품이 등록되면 소개와 사용 방법이 표시됩니다.",
    url:"", emoji:"🔌", image:"" },
  { group:"ooo", author:"ooo", category:"중등", title:"새로운 앱을 연결해주세요.",
    topic:"새로운 작품이 곧 이 자리에 연결될 예정입니다.",
    usage:"작품이 등록되면 소개와 사용 방법이 표시됩니다.",
    url:"", emoji:"🔌", image:"" },
];

/* ============================================================
   ★★★ 여기서부터는 수정할 필요 없습니다 (렌더링 엔진) ★★★
============================================================ */

/* ---------- 사이트 정보 채우기 ---------- */
const orgSlot = document.getElementById("orgSlot");
if (SITE.orgLogo) {
  const img = document.createElement("img");
  img.src = SITE.orgLogo; img.alt = SITE.orgName;
  orgSlot.appendChild(img);
} else {
  orgSlot.textContent = SITE.orgName;
}
document.getElementById("progSlot").textContent = SITE.programName;
document.getElementById("eyebrowSlot").textContent = SITE.eyebrow;
document.getElementById("titleSlot").innerHTML =
  SITE.titleWords.map((w, i) =>
    `<span class="w" style="animation-delay:${(0.10 + i * 0.14).toFixed(2)}s">${w}</span>`
  ).join(" ") + `<br><span class="glow">${SITE.titleGlow}</span>`;
document.getElementById("subSlot").innerHTML = SITE.subHTML;
document.getElementById("sectionTitleSlot").innerHTML =
  `${SITE.sectionTitle}<small>${SITE.sectionHint}</small>`;
document.getElementById("specLabel1").textContent = SITE.specLabel1;
document.getElementById("specLabel2").textContent = SITE.specLabel2;
document.getElementById("footerSlot").innerHTML =
  SITE.footerLines.map(l => `<div>${l}</div>`).join("");

/* ---------- 자동 썸네일 색 (차분한 기관 톤 15종 순환) ---------- */
const GRADS = [
  ["#7E9CC9","#1B3A6B"], ["#8FB6A8","#2F7D5B"], ["#9BAEC8","#3E5578"],
  ["#C9B68A","#8A6D2E"], ["#8FB0C9","#2E5F8A"], ["#A8B8D8","#4A5A8A"],
  ["#93C0B4","#2E6E5E"], ["#B0A8C8","#5A4E8A"], ["#A0B8A8","#3E6E4E"],
  ["#C0A898","#8A5E42"], ["#90A8C0","#2E4E78"], ["#B8C0A0","#6E7A3E"],
  ["#98B8C8","#2E6E8A"], ["#C0B0A0","#7A5E3E"], ["#A8C0B8","#3E7A6E"],
];

/* ---------- 필터 버튼 생성 ---------- */
const filtersEl = document.getElementById("filters");
let currentFilter = "전체";
["전체", ...CATEGORIES.map(c => c.key)].forEach((key, i) => {
  const btn = document.createElement("button");
  btn.className = "filter-btn" + (i === 0 ? " active" : "");
  btn.dataset.filter = key;
  btn.setAttribute("role", "tab");
  btn.setAttribute("aria-selected", i === 0 ? "true" : "false");
  btn.textContent = key === "전체" ? "전체" : (CATEGORIES.find(c => c.key === key).label);
  btn.addEventListener("click", () => {
    filtersEl.querySelectorAll(".filter-btn").forEach(b => {
      b.classList.remove("active"); b.setAttribute("aria-selected","false");
    });
    btn.classList.add("active");
    btn.setAttribute("aria-selected","true");
    currentFilter = key;
    render();
  });
  filtersEl.appendChild(btn);
});

/* ---------- 갤러리 렌더링 ---------- */
const grid = document.getElementById("grid");
const catOf = item => CATEGORIES.find(c => c.key === item.category) || CATEGORIES[0];

function render(){
  grid.innerHTML = "";
  ITEMS.forEach((item, i) => {
    if (currentFilter !== "전체" && item.category !== currentFilter) return;
    const card = document.createElement("button");
    card.className = "card";
    card.setAttribute("aria-haspopup", "dialog");
    card.setAttribute("aria-label", `${SITE.badge(i+1)} ${item.title} — ${item.group} ${item.author}, 소개 카드 열기`);

    const [c1, c2] = GRADS[i % GRADS.length];
    const cat = catOf(item);
    const thumbInner = item.image
      ? `<img src="${item.image}" alt="${item.title} 화면">`
      : `<span>${item.emoji}</span>`;

    card.innerHTML = `
      <div class="thumb" style="background:linear-gradient(150deg,${c1},${c2})">
        <span class="badge">${SITE.badge(i+1)}</span>${thumbInner}
      </div>
      <div class="label">
        <h3></h3>
        <span class="byline"></span>
        <div class="meta-row">
          <span class="chip" style="background:${cat.tint};color:${cat.color}">${cat.label}</span>
          <span class="open-hint">소개 카드 열기 →</span>
        </div>
      </div>`;
    card.querySelector("h3").textContent = item.title;
    card.querySelector(".byline").textContent = `${item.group} · ${item.author}`;
    card.addEventListener("click", () => openPlacard(i));
    grid.appendChild(card);
  });
}

/* ---------- 도록형 작품 카드 (모달) ---------- */
const overlay = document.getElementById("overlay");
let lastFocus = null;

function openPlacard(i){
  const item = ITEMS[i];
  lastFocus = document.activeElement;
  const [c1, c2] = GRADS[i % GRADS.length];
  const thumb = document.getElementById("pThumb");
  thumb.style.background = `linear-gradient(150deg,${c1},${c2})`;
  thumb.innerHTML = item.image
    ? `<img src="${item.image}" alt="${item.title} 화면">`
    : `<span>${item.emoji}</span>`;

  document.getElementById("pNo").textContent = SITE.badge(i+1);
  document.getElementById("pDiv").textContent = catOf(item).label;
  document.getElementById("pTitle").textContent = item.title;
  document.getElementById("pArtist").innerHTML = SITE.artistLine(item);
  document.getElementById("pTopic").textContent = item.topic;
  document.getElementById("pUsage").textContent = item.usage;

  const go = document.getElementById("pGo");
  if (item.url) {
    go.href = item.url;
    go.textContent = SITE.goText;
    go.classList.remove("disabled");
    go.removeAttribute("aria-disabled");
  } else {
    go.removeAttribute("href");
    go.textContent = SITE.noUrlText;
    go.classList.add("disabled");
    go.setAttribute("aria-disabled","true");
  }
  overlay.classList.add("show");
  document.body.style.overflow = "hidden";
  document.getElementById("pClose").focus();
}

function closePlacard(){
  overlay.classList.remove("show");
  document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}
document.getElementById("pClose").addEventListener("click", closePlacard);
overlay.addEventListener("click", e => { if (e.target === overlay) closePlacard(); });
document.addEventListener("keydown", e => {
  if (!overlay.classList.contains("show")) return;
  if (e.key === "Escape") { closePlacard(); return; }
  if (e.key === "Tab") {
    /* 포커스 트랩: 카드가 열린 동안 Tab이 배경으로 나가지 않게 */
    const focusables = overlay.querySelectorAll('a[href], button:not([disabled])');
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
    else if (!overlay.contains(document.activeElement)) { first.focus(); e.preventDefault(); }
  }
});

render();

/* ============================================================
   전시 연출 — 타이핑 프롬프트 · 자동 전시 모드 · 닷 스피어
============================================================ */
/* 전시용 페이지: OS '동작 줄이기' 설정과 무관하게 항상 재생 (행사장 PC 대응) */
const RM = false;

/* 살아있는 프롬프트 타이핑 */
(function typing(){
  const el = document.getElementById("typeText");
  if (!el || !SITE.prompts.length) return;
  if (RM) { el.textContent = SITE.prompts[0]; return; }
  let pi = 0, ci = 0, del = false;
  function tick(){
    const t = SITE.prompts[pi];
    if (!del) {
      ci++;
      el.textContent = t.slice(0, ci);
      if (ci === t.length) { del = true; setTimeout(tick, 1700); return; }
    } else {
      ci--;
      el.textContent = t.slice(0, ci);
      if (ci === 0) { del = false; pi = (pi + 1) % SITE.prompts.length; }
    }
    setTimeout(tick, del ? 34 : 92);
  }
  tick();
})();

/* 자동 전시 모드: 무조작 시 작품 카드가 스스로 순환 (url 있는 작품만).
   화면을 만지면 즉시 멈추고 수동 조작으로 돌아갑니다. */
let idleTimer = null, autoTimer = null, autoOn = false, autoIdx = 0;

function startAuto(){
  if (autoOn) return;
  const linked = ITEMS.map((a, i) => a.url ? i : -1).filter(i => i >= 0);
  if (!linked.length) return;
  autoOn = true;
  (function cycle(){
    if (!autoOn) return;
    openPlacard(linked[autoIdx % linked.length]);
    autoIdx++;
    autoTimer = setTimeout(() => {
      if (!autoOn) return;
      closePlacard();
      autoTimer = setTimeout(cycle, SITE.gapMs);
    }, SITE.showMs);
  })();
}
function stopAuto(){
  clearTimeout(autoTimer);
  autoOn = false;
  resetIdle();
}
function resetIdle(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(startAuto, SITE.idleMs);
}
["pointerdown", "keydown", "wheel", "touchstart"].forEach(ev =>
  document.addEventListener(ev, stopAuto, { passive: true }));
resetIdle();

/* 디지털 닷 스피어 — 점으로 된 지구가 연꽃 뒤에서 천천히 자전 */
(function(){
  const cv = document.getElementById("globe");
  if (!cv) return;
  if (RM) { cv.style.display = "none"; return; }
  const ctx = cv.getContext("2d");
  const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  let raf = null, th = 0;

  const N = 720;
  const TILT = -0.21;
  const SPEED = 0.0016;
  const pts = [];
  const GA = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++){
    const y = 1 - (i / (N - 1)) * 2;
    const r = Math.sqrt(1 - y * y);
    const a = GA * i;
    pts.push({ x: Math.cos(a) * r, y, z: Math.sin(a) * r,
               tw: Math.random() * 6.283,
               teal: i % 9 === 0 });
  }

  function size(){
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * DPR; cv.height = h * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function step(){
    th += SPEED;
    const w = cv.clientWidth, h = cv.clientHeight;
    const cx = w / 2, cy = h / 2, R = w * 0.42;
    ctx.clearRect(0, 0, w, h);

    const halo = ctx.createRadialGradient(cx, cy, R * .55, cx, cy, R * 1.25);
    halo.addColorStop(0, "rgba(60,120,220,0)");
    halo.addColorStop(.75, "rgba(70,140,235,.10)");
    halo.addColorStop(1, "rgba(70,140,235,0)");
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, w, h);

    const cosT = Math.cos(th), sinT = Math.sin(th);
    const cosK = Math.cos(TILT), sinK = Math.sin(TILT);
    const t = performance.now() * 0.001;

    for (const p of pts){
      const x1 = p.x * cosT + p.z * sinT;
      const z1 = -p.x * sinT + p.z * cosT;
      const x2 = x1 * cosK - p.y * sinK;
      const y2 = x1 * sinK + p.y * cosK;

      const sx = cx + x2 * R;
      const sy = cy + y2 * R;
      const depth = (z1 + 1) / 2;
      const twinkle = .85 + Math.sin(t * 1.4 + p.tw) * .15;
      const alpha = (0.10 + depth * 0.75) * twinkle;
      const size = 0.7 + depth * 1.25;

      ctx.fillStyle = p.teal
        ? `rgba(110,230,205,${alpha.toFixed(3)})`
        : `rgba(125,190,255,${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(sx, sy, size, 0, 6.283);
      ctx.fill();
    }
    raf = requestAnimationFrame(step);
  }
  function start(){ if (!raf) raf = requestAnimationFrame(step); }
  function stop(){ cancelAnimationFrame(raf); raf = null; }
  window.addEventListener("resize", size);
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());
  size(); start();
})();
</script>
