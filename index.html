<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AID+30 작품 전시관 — 계원예술대학교</title>
<meta name="description" content="계원예술대학교 AID+30 수강생이 수업에서 직접 만든 도구를 전시합니다.">
<!-- 오픈그래프 — 링크 미리보기. og.png는 히어로 1200×630 캡처 (브랜드 색 확정 시 재캡처) -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://wowtinasem.github.io/kw_aid30_z/">
<meta property="og:title" content="AID+30 작품 전시관 — 계원예술대학교">
<meta property="og:description" content="AID+30 수강생이 수업에서 직접 만든 도구를 전시합니다.">
<meta property="og:image" content="https://wowtinasem.github.io/kw_aid30_z/img/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
/* ============================================================
   AID+30 작품 전시관 — 화면·동작 (index.html)
   데이터는 data/items.js 에만 있습니다. 상세 명세: AID30-exhibition-spec.md
============================================================ */
:root{
  /* 색 — 브랜드 슬롯은 명세 부록 B 확인 후 교체 */
  --brand:      #16233A;   /* TODO: 계원 공식 색으로 교체. 필터 선택·배지·링크 아이콘 */
  --brand-deep: #0E1726;   /* TODO: brand의 어두운 톤. 히어로 배경·푸터 */
  --brand-tint: #EDF0F5;   /* TODO: brand의 옅은 톤. 라벨 배경 */
  --paper:      #FFFFFF;   /* 카드 */
  --bg:         #F7F7F5;   /* 갤러리 바탕 — 흰 카드가 떠 보이는 최소한의 회색 */
  --ink:        #17171A;
  --muted:      #6E6C68;
  --line:       #E3E1DC;
  --radius:     6px;

  /* 어두운 면(히어로·푸터) 위 글자색 — brand 교체 시 함께 확인 */
  --on-brand:       #FFFFFF;
  --on-brand-muted: #C7CEDA;

  /* 파생 토큰 — 본문에 색값을 직접 쓰지 않기 위한 슬롯 */
  --shadow-card:       0 2px 10px rgba(23,23,26,.06);
  --shadow-card-hover: 0 12px 28px rgba(23,23,26,.14);
  --shadow-modal:      0 28px 80px rgba(0,0,0,.35);
  --overlay-bg:        rgba(14,23,38,.55);
  --panel-line:        rgba(255,255,255,.22);

  /* 히어로 연출 색 */
  --hero-accent-1: #7FB8FF;              /* 하늘빛 포인트 (작은 제목·캐럿) */
  --hero-accent-2: #5EEAD4;              /* 민트빛 포인트 (프롬프트 마크) */
  --stage-dot:     rgba(140,180,255,.20);/* 점 격자 */
  --beam-a:        rgba(90,160,255,.30); /* 빔 스윕 */
  --beam-b:        rgba(94,234,212,.18);

  /* 타이포 — 웹폰트 없음, 시스템 폰트만 */
  --font-display: "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:    "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:    ui-monospace,"SF Mono",Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--font-body);
  background:var(--bg);color:var(--ink);
  font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- 기관 표시줄 (48px, 스크롤 시 고정하지 않음) ---------- */
.gov-bar{
  height:48px;background:var(--brand-deep);color:var(--on-brand);
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:0 20px;font-size:.85rem;
}
.gov-bar .org{font-weight:700;display:flex;align-items:center;min-width:0}
.gov-bar .org img{height:30px;width:auto}
.gov-bar .prog{color:var(--on-brand-muted);font-weight:600;letter-spacing:.08em;white-space:nowrap}

/* ---------- 히어로 — 2단 구성: 왼쪽 카피 + 오른쪽 연출 무대 ---------- */
.hero{
  position:relative;overflow:hidden;
  background:var(--brand-deep);color:var(--on-brand);
  padding:56px 24px 48px;
}
/* 무대 배경: 점 격자 + 빔 스윕 */
.stage{position:absolute;inset:0;z-index:1;pointer-events:none}
.grid-dots{
  position:absolute;inset:0;
  background-image:radial-gradient(var(--stage-dot) 1px, transparent 1.4px);
  background-size:26px 26px;
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,.3));
  mask-image:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,.3));
}
.beam{
  position:absolute;top:-45%;height:190%;width:32vw;min-width:300px;left:50%;
  background:linear-gradient(90deg,transparent,var(--beam-a) 45%,var(--beam-b) 58%,transparent);
  filter:blur(36px);mix-blend-mode:screen;
  animation:sweep 28s linear infinite;
}
.beam.b2{width:14vw;min-width:160px;opacity:.65;animation-delay:-14s}
@keyframes sweep{
  from{transform:translateX(-92vw) rotate(14deg)}
  to  {transform:translateX(92vw)  rotate(14deg)}
}
.hero-inner{
  position:relative;z-index:2;
  max-width:1080px;margin:0 auto;
  display:grid;grid-template-columns:1.05fr .95fr;
  align-items:center;gap:44px;
  text-align:left;
}
.hero-copy{min-width:0}
.eyebrow{
  display:inline-block;font-size:.85rem;font-weight:700;
  letter-spacing:.22em;color:var(--hero-accent-1);
}
.hero h1{
  font-family:var(--font-display);
  font-size:clamp(2.4rem,6vw,4.6rem);font-weight:700;
  letter-spacing:-.03em;line-height:1.1;
  margin:12px 0 16px;
}
/* 강조 줄 — 브랜드 색 단색 (공식 색 확정 시 :root의 --brand-tint 교체) */
.hero h1 .glow{
  color:var(--brand-tint);
  display:inline-block;opacity:0;transform:translateY(24px);
  animation:rise .6s .38s cubic-bezier(.2,.7,.3,1) both;
}
.hero-sub{font-size:1rem;color:var(--on-brand-muted);max-width:560px}
.hero-sub b{color:var(--on-brand);font-weight:700}

/* 모션 — 단어별 등장 */
.w{display:inline-block;opacity:0;transform:translateY(24px);
  animation:rise .6s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* 타이핑 카드 — 문구는 ITEMS의 prompt·제목에서 생성 */
.prompt-line{
  max-width:520px;margin:24px 0 0;
  background:var(--brand);
  border:1px solid var(--panel-line);
  border-radius:12px;padding:13px 18px;text-align:left;
  font-size:.95rem;color:var(--on-brand);
  display:flex;align-items:flex-start;gap:10px;
  opacity:0;
  animation:rise .6s .8s cubic-bezier(.2,.7,.3,1) both,
            floatY 6s ease-in-out 1.8s infinite;
}
.prompt-line .mark{color:var(--hero-accent-2);font-weight:900}
.prompt-line .typed{min-height:1.7em}
.caret{display:inline-block;width:2px;height:1.05em;
  margin-top:.35em;flex:none;
  background:var(--hero-accent-1);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- 오른쪽 작품 무대 — 말(타이핑) → 결과(작품) ---------- */
.hero-visual{min-width:0;display:flex;flex-direction:column;gap:10px}
.stage-frame{
  position:relative;width:100%;aspect-ratio:16/9;
  background:var(--brand);
  border:1px solid var(--panel-line);border-radius:var(--radius);
  overflow:hidden;
}
.stage-dots{position:absolute;inset:0}
.stage-dot{
  position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;
  border-radius:50%;background:var(--hero-accent-1);
  opacity:0;
  transition:left .6s cubic-bezier(0,0,.2,1), top .6s cubic-bezier(0,0,.2,1), opacity .6s ease-out;
}
.stage-shot{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .5s ease;
}
.stage-emoji{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:56px;opacity:0;transition:opacity .5s ease;
}
.stage-shot.show,.stage-emoji.show{opacity:1}
.stage-caption{
  display:flex;align-items:baseline;gap:10px;min-height:1.7em;
  opacity:0;transition:opacity .5s ease;
}
.stage-caption.show{opacity:1}
.stage-title{font-weight:600;font-size:1rem;color:var(--on-brand)}
.stage-by{font-size:.85rem;color:var(--on-brand-muted)}

@media (max-width:900px){
  .hero-inner{grid-template-columns:1fr;text-align:center;gap:10px}
  .hero-sub{margin:0 auto}
  .prompt-line{margin:24px auto 0}
  .hero-visual{margin-top:24px;max-width:520px;width:100%;justify-self:center}
  .stage-caption{justify-content:center}
}

/* 감속 설정 — 연출을 최종 상태로 즉시 표시 (무대는 첫 작품 고정) */
@media (prefers-reduced-motion: reduce){
  .w,.hero h1 .glow{animation:none;opacity:1;transform:none}
  .caret{animation:none}
  .beam{animation:none}
  .prompt-line{animation:none;opacity:1}
  .stage-dot,.stage-shot,.stage-emoji,.stage-caption{transition:none}
}

/* ---------- 소개 스트립 — 히어로 하단 어두운 한 줄 (흰 갤러리와의 경계) ---------- */
.stats{
  background:var(--brand);color:var(--on-brand-muted);
  border-top:1px solid var(--panel-line);
  display:flex;justify-content:center;align-items:center;
  gap:8px 28px;flex-wrap:wrap;
  padding:12px 20px;font-size:.9rem;
}
.stats b{color:var(--on-brand);font-weight:700;margin-right:4px}

/* ---------- 작품 목록 ---------- */
.works{max-width:1200px;width:100%;margin:0 auto;padding:0 20px 64px}
.toolbar{
  display:flex;justify-content:space-between;align-items:flex-end;
  gap:12px 16px;flex-wrap:wrap;padding:36px 0 16px;
}
.section-title{font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
.section-title small{display:block;font-size:.82rem;font-weight:400;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filter-btn{
  border:1px solid var(--line);background:var(--paper);color:var(--muted);
  font-size:.85rem;font-weight:500;min-height:44px;padding:8px 16px;
  border-radius:var(--radius);
  transition:border-color .15s ease, color .15s ease;
}
.filter-btn:hover{border-color:var(--brand);color:var(--brand)}
.filter-btn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:700}

/* ---------- 갤러리 그리드 (4열 → 2열 → 1열) ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:1020px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}

/* 카드 — 전체가 하나의 버튼 */
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;text-align:left;display:flex;flex-direction:column;
  box-shadow:var(--shadow-card);
  transition:transform .15s ease, box-shadow .15s ease;
}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-card-hover)}  /* 모션 3 */
.thumb{
  width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;
  background:var(--brand-tint);
  display:flex;align-items:center;justify-content:center;
}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb-emoji{font-size:44px;line-height:1}
/* 영상이 있는 카드 — 재생 삼각형 (인라인 SVG, 반투명 원) */
.play-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.play-badge svg{width:44px;height:44px}
.play-badge .pb-c{fill:var(--overlay-bg)}
.play-badge .pb-t{fill:var(--on-brand)}
.label{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.card-title{font-size:1.05rem;font-weight:600;line-height:1.45;color:var(--ink)}
.byline{font-size:.82rem;color:var(--muted)}
.meta-row{margin-top:auto;padding-top:10px;display:flex;align-items:center;gap:8px}
.badge{font-size:.82rem;color:var(--muted);letter-spacing:.02em}
/* 링크 보유 아이콘 3개 — 보유/미보유를 색·투명도 + title·aria 텍스트로 함께 표시 */
.link-state{margin-left:auto;display:flex;gap:5px}
.lk{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px}
.lk svg{width:15px;height:15px}
.lk.on{color:var(--brand)}
.lk.off{color:var(--line);opacity:.7}
.empty{padding:48px 0;text-align:center;color:var(--muted)}

/* ---------- 도록형 작품 카드 (모달) ---------- */
body.modal-open{overflow:hidden}
.overlay{
  position:fixed;inset:0;background:var(--overlay-bg);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:50;
}
.overlay.show{display:flex;animation:fadeIn .18s ease}
.placard{
  background:var(--paper);border-radius:10px;max-width:600px;width:100%;
  max-height:90vh;overflow:auto;
  box-shadow:var(--shadow-modal);
  animation:placardIn .22s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes placardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* 감속 설정·자동 전시 — 이동 없이 페이드만 */
@media (prefers-reduced-motion: reduce){
  .placard{animation:fadeIn .18s ease}
}
.overlay.auto .placard{animation:fadeIn .28s ease}
.placard-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 8px 8px 22px;border-bottom:1px solid var(--line);
}
.p-badge{font-size:.82rem;font-weight:700;letter-spacing:.08em;color:var(--brand)}
.p-close{
  width:44px;height:44px;border:none;background:none;color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius);
}
.p-close:hover{color:var(--ink);background:var(--brand-tint)}
.p-close svg{width:18px;height:18px}
.placard-title-block{padding:18px 22px 0}
.placard h2{font-size:1.4rem;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.placard .artist{font-size:.9rem;color:var(--muted);margin-top:2px}
.placard .artist b{color:var(--ink)}
.p-thumb{margin:16px 22px 0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.p-thumb .thumb-emoji{font-size:60px}
.spec{margin:18px 22px 0;border-top:2px solid var(--brand)}
.spec-row{display:grid;grid-template-columns:96px 1fr;border-bottom:1px solid var(--line)}
.spec-row dt{
  background:var(--brand-tint);color:var(--brand);
  font-size:.82rem;font-weight:700;letter-spacing:.04em;
  padding:12px;display:flex;align-items:flex-start;
}
.spec-row dd{font-size:.9rem;padding:12px 14px;white-space:pre-line}
/* 모노는 「어떻게 시켰나」 칸에만 — 요청문이 '적어 낸 말'로 보이게 */
.spec-row dd.mono{font-family:var(--font-mono);font-size:.85rem;background:var(--bg)}
@media (max-width:680px){.spec-row{grid-template-columns:82px 1fr}}
.placard-actions{display:flex;gap:10px;flex-wrap:wrap;padding:20px 22px 24px}
.btn{
  border:1px solid var(--line);border-radius:var(--radius);
  font-size:.95rem;font-weight:700;min-height:48px;padding:10px 20px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  text-decoration:none;background:var(--paper);color:var(--ink);
  transition:background .15s ease, border-color .15s ease;
}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);flex:1;min-width:160px}
.btn-primary:hover{background:var(--brand-deep)}
.btn:not(.btn-primary):not(:disabled):hover{border-color:var(--muted)}
.btn:disabled{cursor:not-allowed;color:var(--muted);background:var(--bg);font-weight:500}

/* ---------- 푸터 ---------- */
footer{
  background:var(--brand-deep);color:var(--on-brand-muted);
  padding:30px 20px;text-align:center;font-size:.82rem;line-height:1.9;
}
footer .org{color:var(--on-brand);font-weight:700;font-size:.9rem}

/* ---------- noscript ---------- */
.noscript-note{padding:48px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>

<!-- ================= 기관 표시줄 ================= -->
<div class="gov-bar">
  <span class="org" id="orgSlot"></span>
  <span class="prog" id="progSlot"></span>
</div>

<!-- ================= 히어로 ================= -->
<header class="hero">
  <div class="stage" aria-hidden="true">
    <div class="grid-dots"></div>
    <div class="beam b1"></div>
    <div class="beam b2"></div>
  </div>
  <div class="hero-inner">
    <div class="hero-copy">
      <p class="eyebrow" id="eyebrowSlot"></p>
      <h1 id="titleSlot"></h1>
      <p class="hero-sub" id="subSlot"></p>
      <div class="prompt-line" aria-hidden="true"><span class="mark">＞</span><span class="typed" id="typeText"></span><span class="caret"></span></div>
    </div>
    <div class="hero-visual" aria-hidden="true">
      <div class="stage-frame">
        <div class="stage-dots" id="stageDots"></div>
        <img class="stage-shot" id="stageShot" alt="">
        <span class="stage-emoji" id="stageEmoji"></span>
      </div>
      <p class="stage-caption" id="stageCaption"><span class="stage-title" id="stageTitle"></span><span class="stage-by" id="stageBy"></span></p>
    </div>
  </div>
</header>

<!-- ================= 소개 스트립 ================= -->
<div class="stats" id="statsSlot"></div>

<!-- ================= 작품 목록 ================= -->
<main class="works">
  <div class="toolbar">
    <h2 class="section-title" id="sectionTitleSlot"></h2>
    <div class="filters" id="filters" role="group" aria-label="기수 필터"></div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden></p>
</main>

<!-- ================= 도록형 작품 카드 (모달) ================= -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <article class="placard">
    <div class="placard-head">
      <span class="p-badge" id="pBadge"></span>
      <button class="p-close" id="pClose" aria-label="소개 카드 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="placard-title-block">
      <h2 id="pTitle"></h2>
      <p class="artist" id="pArtist"></p>
    </div>
    <div class="p-thumb" id="pThumb"></div>
    <dl class="spec" id="pSpec"></dl>
    <div class="placard-actions" id="pActions"></div>
  </article>
</div>

<!-- ================= 푸터 ================= -->
<footer id="footerSlot"></footer>

<noscript><p class="noscript-note">이 페이지는 자바스크립트로 작품 목록을 표시합니다. 브라우저에서 자바스크립트를 켠 뒤 새로고침해 주세요.</p></noscript>

<script src="data/items.js"></script>
<script>
/* ============================================================
   렌더링 엔진 — 데이터는 data/items.js 에서만 옵니다
============================================================ */
const $ = id => document.getElementById(id);

/* ---------- 기관 표시줄 ---------- */
(function(){
  const slot = $("orgSlot");
  if (SITE.orgLogo){
    const img = new Image();
    img.src = SITE.orgLogo;
    img.alt = SITE.orgName;
    /* 로고 파일이 아직 없으면 기관명 텍스트로 대체 */
    img.onerror = () => { img.remove(); slot.textContent = SITE.orgName; };
    slot.appendChild(img);
  } else {
    slot.textContent = SITE.orgName;
  }
  $("progSlot").textContent = SITE.programName;
})();

/* ---------- 감속 설정 ---------- */
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- 히어로 ---------- */
$("eyebrowSlot").textContent = SITE.eyebrow;
$("titleSlot").innerHTML =
  SITE.titleWords.map((w, i) =>
    `<span class="w" style="animation-delay:${(0.10 + i * 0.14).toFixed(2)}s">${w}</span>`
  ).join(" ") +
  `<br><span class="glow">${SITE.titleGlow}</span>`;
$("subSlot").innerHTML = SITE.subHTML;

/* ---------- 소개 스트립 — 숫자는 데이터에서 계산 ---------- */
(function(){
  const authors = new Set(ITEMS.map(it => it.author).filter(Boolean));
  const third = SITE.stats[2] || SITE.stats[SITE.stats.length - 1];
  const items = [
    { value: ITEMS.length, label: "작품" },
    { value: authors.size, label: "참여 인원" },
    ...(third ? [third] : []),
  ];
  $("statsSlot").innerHTML =
    items.map(s => `<span><b>${s.value}</b>${s.label}</span>`).join("");
})();

/* ============================================================
   작품 갤러리
============================================================ */
const el = (tag, cls) => { const n = document.createElement(tag); if (cls) n.className = cls; return n; };
const pad2 = n => String(n).padStart(2, "0");

/* 링크 상태 아이콘 — 인라인 SVG 3종 (앱·영상·자료) */
const ICONS = {
  app:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>',
  video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m10 9 5 3-5 3z" fill="currentColor" stroke="none"/></svg>',
  extra: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
};
const LINK_LABEL = { app: "배포 링크", video: "시연 영상", extra: "기타 자료" };

$("sectionTitleSlot").innerHTML = `${SITE.sectionTitle}<small>${SITE.sectionHint}</small>`;

/* 유튜브 주소 4형태에서 영상 ID 추출: youtu.be/ID · watch?v=ID · shorts/ID · embed/ID */
function ytId(url){
  if (!url) return "";
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{6,})/);
  return m ? m[1] : "";
}

function playBadge(){
  const s = el("span", "play-badge");
  s.innerHTML = '<svg viewBox="0 0 48 48" aria-hidden="true"><circle class="pb-c" cx="24" cy="24" r="21"/><path class="pb-t" d="M19.5 15.5 34 24l-14.5 8.5z"/></svg>';
  return s;
}

/* 썸네일 우선순위 (명세 7절): ① item.image → ② 유튜브 hqdefault → ③ 이모지 카드
   maxresdefault는 영상에 따라 404가 나므로 쓰지 않습니다.
   유튜브 썸네일은 외부 자원 — 실패하면 onerror로 이모지 카드까지 떨어집니다. */
function makeThumb(item){
  const wrap = el("span", "thumb");
  const yid = ytId(item.links.video);
  const showEmoji = () => {
    wrap.textContent = "";
    const e = el("span", "thumb-emoji");
    e.textContent = item.emoji || "🧩";
    e.setAttribute("aria-hidden", "true");
    wrap.appendChild(e);
    if (yid) wrap.appendChild(playBadge());
  };
  const sources = [];
  if (item.image) sources.push(item.image);
  if (yid) sources.push(`https://img.youtube.com/vi/${yid}/hqdefault.jpg`);
  if (!sources.length){ showEmoji(); return wrap; }
  let si = 0;
  const img = new Image();
  img.alt = item.title;
  img.onerror = () => { si++; si < sources.length ? (img.src = sources[si]) : showEmoji(); };
  img.src = sources[0];
  wrap.appendChild(img);
  if (yid) wrap.appendChild(playBadge());
  return wrap;
}

function linkStateHTML(item){
  return `<span class="link-state">` + ["app", "video", "extra"].map(k => {
    const has = !!item.links[k];
    return `<span class="lk ${has ? "on" : "off"}" title="${LINK_LABEL[k]} ${has ? "있음" : "없음"}">${ICONS[k]}</span>`;
  }).join("") + `</span>`;
}
function linkStateText(item){
  return ["app", "video", "extra"]
    .map(k => `${LINK_LABEL[k]} ${item.links[k] ? "있음" : "없음"}`).join(", ");
}

const grid = $("grid");

function makeCard(item){
  const card = el("button", "card");
  card.setAttribute("aria-haspopup", "dialog");
  card.setAttribute("aria-label",
    `${SITE.badge(item.cohort, item.no)} ${item.title} — ${item.group} ${item.author}. ${linkStateText(item)}. 소개 카드 열기`);
  card.appendChild(makeThumb(item));
  const label = el("span", "label");
  const title = el("span", "card-title"); title.textContent = item.title;
  const by = el("span", "byline"); by.textContent = `${item.group} · ${item.author}`;
  const meta = el("span", "meta-row");
  const badge = el("span", "badge"); badge.textContent = SITE.badge(item.cohort, item.no);
  meta.appendChild(badge);
  meta.insertAdjacentHTML("beforeend", linkStateHTML(item));
  label.append(title, by, meta);
  card.appendChild(label);
  card.addEventListener("click", () => requestOpen(item));
  return card;
}

/* ---------- 정렬: 기수 내림차순(최신 먼저) → 번호 오름차순 ----------
   배열 순서에 의존하지 않습니다 */
const cohortRank = key => {
  const i = COHORTS.findIndex(c => c.key === key);
  return i < 0 ? COHORTS.length : i;
};
const SORTED = [...ITEMS].sort((a, b) =>
  cohortRank(a.cohort) - cohortRank(b.cohort) || a.no - b.no);

/* (기수, 번호) 조합 중복 경고 */
(function(){
  const seen = new Set();
  ITEMS.forEach(it => {
    const k = `${it.cohort}-${it.no}`;
    if (seen.has(k)) console.warn(`ITEMS: 기수·번호 중복 — ${k} (${it.title})`);
    seen.add(k);
  });
})();

/* ---------- 기수 필터 — 기본 선택은 최신 기수, "전체"는 마지막 ---------- */
const filtersEl = $("filters");
const countOf = key => ITEMS.filter(it => it.cohort === key).length;
const withItems = COHORTS.filter(c => countOf(c.key) > 0);   /* 작품 0개 기수는 버튼을 만들지 않음 */
let currentFilter = withItems.length ? withItems[0].key : "all";

function buildFilters(){
  filtersEl.textContent = "";
  const defs = [
    ...withItems.map(c => ({ key: c.key, text: `${c.label} · ${c.period}` })),
    { key: "all", text: `전체 (${ITEMS.length})` },
  ];
  defs.forEach(d => {
    const b = el("button", "filter-btn");
    b.textContent = d.text;
    b.setAttribute("aria-pressed", String(d.key === currentFilter));
    b.addEventListener("click", () => {
      currentFilter = d.key;
      filtersEl.querySelectorAll(".filter-btn").forEach(x => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      render();   /* 필터는 URL을 바꾸지 않습니다 */
    });
    filtersEl.appendChild(b);
  });
}

function render(){
  grid.textContent = "";
  SORTED
    .filter(it => currentFilter === "all" || it.cohort === currentFilter)
    .forEach(item => grid.appendChild(makeCard(item)));
  $("empty").textContent = "이 기수의 작품은 준비 중입니다.";
  $("empty").hidden = grid.children.length > 0;
}
buildFilters();
render();

/* ---------- 히어로 시퀀스 — 말(타이핑) → 결과(작품 무대) ----------
   prompt가 있는 작품을 순환:
   ① 왼쪽 카드에 prompt 첫 줄 타이핑(40ms/글자)
   ② 끝나면 오른쪽 무대에 점 4×3 정렬(0.6s ease-out)
   ③ 격자 소멸 + 썸네일 페이드인 + 작품 이름·소속 표시
   ④ 2.5초 유지 → 페이드아웃 → 다음 작품
   감속 설정이거나 대상이 2개 미만이면 첫 작품의 ③ 상태로 고정 */
(function heroSequence(){
  const typeEl = $("typeText");
  const dotsWrap = $("stageDots"), shot = $("stageShot"),
        emojiEl = $("stageEmoji"), cap = $("stageCaption"),
        capTitle = $("stageTitle"), capBy = $("stageBy");
  if (!typeEl || !dotsWrap) return;
  const works = SORTED.filter(it => it.prompt);

  /* prompt 있는 작품이 없으면 무대를 숨기고 작품 제목만 타이핑 */
  if (!works.length){
    const vis = document.querySelector(".hero-visual");
    if (vis) vis.style.display = "none";
    const phrases = SORTED.map(it => it.title).filter(Boolean);
    if (!phrases.length) return;
    if (REDUCED){ typeEl.textContent = phrases[0]; return; }
    let pi = 0, ci = 0;
    (function t(){
      const s = phrases[pi % phrases.length];
      ci++;
      typeEl.textContent = s.slice(0, ci);
      if (ci >= s.length){ pi++; ci = 0; setTimeout(t, 2200); return; }
      setTimeout(t, 40);
    })();
    return;
  }

  const firstLine = it => it.prompt.split("\n")[0].trim();

  /* 4×3 점 격자 */
  const DOTS = [];
  for (let i = 0; i < 12; i++){
    const d = el("span", "stage-dot");
    dotsWrap.appendChild(d);
    DOTS.push(d);
  }
  const gridX = i => 20 + (i % 4) * 20;
  const gridY = i => 25 + ((i / 4) | 0) * 25;
  function scatterDots(){
    DOTS.forEach(d => {
      d.style.transition = "none";
      d.style.left = (5 + Math.random() * 90) + "%";
      d.style.top  = (10 + Math.random() * 80) + "%";
      d.style.opacity = "0";
    });
  }
  function gridDotsIn(){
    DOTS.forEach((d, i) => {
      void d.offsetWidth;   /* 전환 재개용 리플로 */
      d.style.transition = "";
      d.style.left = gridX(i) + "%";
      d.style.top  = gridY(i) + "%";
      d.style.opacity = "1";
    });
  }
  function dotsOut(){ DOTS.forEach(d => d.style.opacity = "0"); }

  /* 무대 썸네일: image → 유튜브 → 이모지. 실패해도 빈 사각형이 되지 않게 */
  function setThumb(item, done){
    const yid = ytId(item.links.video);
    const sources = [];
    if (item.image) sources.push(item.image);
    if (yid) sources.push(`https://img.youtube.com/vi/${yid}/hqdefault.jpg`);
    emojiEl.textContent = item.emoji || "🧩";
    if (!sources.length){ done("emoji"); return; }
    let si = 0;
    shot.onerror = () => { si++; si < sources.length ? (shot.src = sources[si]) : done("emoji"); };
    shot.onload = () => done("img");
    shot.src = sources[0];
  }

  function showResult(item, done){
    capTitle.textContent = item.title;
    capBy.textContent = `${item.group} ${item.author}`;
    setThumb(item, kind => {
      dotsOut();
      (kind === "img" ? shot : emojiEl).classList.add("show");
      cap.classList.add("show");
      if (done) done();
    });
  }
  function hideResult(){
    shot.classList.remove("show");
    emojiEl.classList.remove("show");
    cap.classList.remove("show");
  }

  if (REDUCED || works.length < 2){
    typeEl.textContent = firstLine(works[0]);
    showResult(works[0]);
    return;
  }

  let wi = 0;
  (function cycle(){
    const item = works[wi % works.length];
    wi++;
    typeEl.textContent = "";
    hideResult();
    scatterDots();
    const line = firstLine(item);
    let ci = 0;
    (function type(){
      ci++;
      typeEl.textContent = line.slice(0, ci);
      if (ci < line.length){ setTimeout(type, 40); return; }
      gridDotsIn();
      setTimeout(() => {
        showResult(item, () => {
          setTimeout(() => {
            hideResult();
            setTimeout(cycle, 550);
          }, 2500);
        });
      }, 750);
    })();
  })();
})();

/* ---------- 도록형 작품 카드 (모달) ---------- */
const overlay = $("overlay");
let lastFocus = null;
let openItem = null;

function specRow(label, text, mono){
  const row = el("div", "spec-row");
  const dt = el("dt"); dt.textContent = label;
  const dd = el("dd"); if (mono) dd.className = "mono";
  dd.textContent = text;
  row.append(dt, dd);
  return row;
}

function openPlacard(item, opts){
  const silent = opts && opts.silent;   /* 자동 전시 모드: 포커스를 건드리지 않음 */
  openItem = item;
  if (!silent) lastFocus = document.activeElement;
  $("pBadge").textContent = SITE.badge(item.cohort, item.no);
  $("pTitle").textContent = item.title;
  $("pArtist").innerHTML = SITE.artistLine(item);
  const pt = $("pThumb"); pt.textContent = ""; pt.appendChild(makeThumb(item));
  const spec = $("pSpec"); spec.textContent = "";
  spec.appendChild(specRow(SITE.labelTopic, item.topic));
  if (item.usage) spec.appendChild(specRow(SITE.labelUsage, item.usage));
  /* prompt가 비면 칸 전체(라벨 포함)를 렌더하지 않습니다 (명세 8절) */
  if (item.prompt) spec.appendChild(specRow(SITE.labelPrompt, item.prompt, true));
  const act = $("pActions"); act.textContent = "";
  ["app", "video", "extra"].forEach(k => {
    const url = item.links[k];
    if (url){
      const a = el("a", "btn" + (k === "app" ? " btn-primary" : ""));
      a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = SITE.linkText[k];
      act.appendChild(a);
    } else {
      /* 링크가 없으면 숨기지 않고 비활성 + 안내 문구 */
      const b = el("button", "btn");
      b.disabled = true;
      b.textContent = SITE.linkNone[k];
      act.appendChild(b);
    }
  });
  overlay.classList.add("show");
  document.body.classList.add("modal-open");
  if (!silent) $("pClose").focus();
}

function closePlacard(opts){
  if (!openItem) return;
  openItem = null;
  overlay.classList.remove("show");
  document.body.classList.remove("modal-open");
  if (!(opts && opts.silent) && lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

$("pClose").addEventListener("click", requestClose);
overlay.addEventListener("click", e => { if (e.target === overlay) requestClose(); });
document.addEventListener("keydown", e => {
  if (!overlay.classList.contains("show")) return;
  if (e.key === "Escape"){ requestClose(); return; }
  if (e.key === "Tab"){
    /* 포커스 트랩 — 카드가 열린 동안 Tab이 배경으로 나가지 않게 */
    const f = overlay.querySelectorAll('a[href], button:not([disabled])');
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last){ first.focus(); e.preventDefault(); }
    else if (!overlay.contains(document.activeElement)){ first.focus(); e.preventDefault(); }
  }
});

/* ---------- 딥링크 — #w-기수-번호 (예: #w-1-07) ----------
   카드 클릭 → 주소 변경 → hashchange가 모달을 엽니다.
   공유한 주소로 접속하면 해당 모달이 열린 상태로 시작하고, 뒤로가기로 닫힙니다. */
const hashOf = item => `#w-${item.cohort}-${pad2(item.no)}`;
function itemByHash(h){
  const m = /^#w-(.+)-(\d+)$/.exec(h);
  if (!m) return null;
  return ITEMS.find(it => it.cohort === m[1] && it.no === Number(m[2])) || null;
}
function requestOpen(item){
  if (openItem === item) return;
  location.hash = hashOf(item);
}
function requestClose(){
  /* 주소에 작품 해시가 있으면 뒤로가기로 주소까지 함께 되돌립니다 */
  if (itemByHash(location.hash)) history.back();
  else closePlacard();
}
function syncFromHash(){
  const item = itemByHash(location.hash);
  if (item) openPlacard(item);
  else closePlacard();
}
window.addEventListener("hashchange", syncFromHash);
syncFromHash();

/* ---------- 자동 전시 모드 — 행사장 대형 화면 대응 ----------
   무조작 idleMs 경과 → 앱 링크가 있는 작품만 순환하며 모달을 자동으로 엽니다.
   마우스·키보드·터치·스크롤 중 무엇이든 감지되면 즉시 해제합니다.
   감속 설정과 무관하게 동작하되 전환은 페이드만 씁니다.
   순환 대상이 5개 미만이면 켜지 않습니다 (명세 8절). */
(function autoMode(){
  const linked = SORTED.filter(it => it.links.app);
  if (linked.length < 5) return;
  let idleTimer = null, stepTimer = null, on = false, idx = 0;

  function start(){
    if (on || openItem) return;   /* 이미 열려 있는 카드 위에 겹치지 않음 */
    on = true;
    overlay.classList.add("auto");
    (function cycle(){
      if (!on) return;
      openPlacard(linked[idx % linked.length], { silent: true });   /* 주소는 바꾸지 않습니다 */
      idx++;
      stepTimer = setTimeout(() => {
        if (!on) return;
        closePlacard({ silent: true });
        stepTimer = setTimeout(cycle, SITE.gapMs);
      }, SITE.showMs);
    })();
  }
  function stop(){
    clearTimeout(stepTimer);
    if (on){
      on = false;
      overlay.classList.remove("auto");
      closePlacard({ silent: true });
    }
    resetIdle();
  }
  function resetIdle(){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(start, SITE.idleMs);
  }
  ["pointerdown", "pointermove", "keydown", "wheel", "touchstart", "scroll"]
    .forEach(ev => window.addEventListener(ev, stop, { passive: true }));
  resetIdle();
})();

/* ---------- 푸터 ---------- */
$("footerSlot").innerHTML = SITE.footerLines.map(l => `<div>${l}</div>`).join("");
</script>
