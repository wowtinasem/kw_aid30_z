<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AID+30 작품 전시관 — 계원예술대학교</title>
<meta name="description" content="계원예술대학교 AID+30 수강생이 수업에서 직접 만든 도구를 전시합니다.">
<!-- 파비콘 — 계원 수신재 초록 마크 -->
<link rel="icon" type="image/png" href="img/favicon.png">
<!-- 오픈그래프 — 링크 미리보기. og.png는 히어로 1200×630 캡처 (브랜드 색 확정 시 재캡처) -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://wowtinasem.github.io/kw_aid30_z/">
<meta property="og:title" content="AID+30 작품 전시관 — 계원예술대학교">
<meta property="og:description" content="AID+30 수강생이 수업에서 직접 만든 도구를 전시합니다.">
<meta property="og:image" content="https://wowtinasem.github.io/kw_aid30_z/img/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
/* ============================================================
   AID+30 작품 전시관 — 화면·동작 (index.html)
   데이터는 data/items.js 에만 있습니다. 상세 명세: AID30-exhibition-spec.md
============================================================ */
:root{
  /* 색 — 브랜드 슬롯은 명세 부록 B 확인 후 교체 */
  --brand:      #16233A;   /* TODO: 계원 공식 색으로 교체. 필터 선택·배지·링크 아이콘 */
  --brand-deep: #0E1726;   /* TODO: brand의 어두운 톤. 히어로 배경·푸터 */
  --brand-tint: #EDF0F5;   /* TODO: brand의 옅은 톤. 라벨 배경 */
  --paper:      #FFFFFF;   /* 카드 */
  --bg:         #F7F7F5;   /* 갤러리 바탕 — 흰 카드가 떠 보이는 최소한의 회색 */
  --ink:        #17171A;
  --muted:      #6E6C68;
  --line:       #E3E1DC;
  --radius:     6px;

  /* 어두운 면(히어로·푸터) 위 글자색 — brand 교체 시 함께 확인 */
  --on-brand:       #FFFFFF;
  --on-brand-muted: #C7CEDA;

  /* 파생 토큰 — 본문에 색값을 직접 쓰지 않기 위한 슬롯 */
  --shadow-card:       0 2px 10px rgba(23,23,26,.06);
  --shadow-card-hover: 0 12px 28px rgba(23,23,26,.14);
  --shadow-modal:      0 28px 80px rgba(0,0,0,.35);
  --overlay-bg:        rgba(14,23,38,.55);
  --glass-bg:          rgba(255,255,255,.07);
  --glass-line:        rgba(255,255,255,.22);

  /* 히어로 연출 색 — 어두운 무대 위 빛 포인트 (부여 원형 참조) */
  --hero-accent-1:    #7FB8FF;              /* 하늘빛 포인트 */
  --hero-accent-2:    #5EEAD4;              /* 민트빛 포인트 */
  --hero-accent-2-hi: #8CF3DF;              /* 민트 하이라이트 (연꽃 심) */
  --hero-accent-3:    #EAF6FF;              /* 시머 하이라이트 */
  --stage-dot:        rgba(140,180,255,.20);/* 점 격자 */
  --beam-a:           rgba(90,160,255,.30); /* 빔 스윕 */
  --beam-b:           rgba(94,234,212,.18);
  --halo-a:           rgba(94,234,212,.16); /* 후광 */
  --halo-b:           rgba(90,160,255,.10);
  --petal-line:       rgba(185,220,255,.38);/* 글래스 연꽃 */
  --petal-fill:       rgba(205,230,255,.16);
  --petal-front-line: rgba(205,235,255,.5);
  --petal-front-fill: rgba(215,238,255,.22);
  --petal-glow:       rgba(90,160,255,.08);
  --ripple-line:      rgba(150,195,255,.28);

  /* 타이포 — 웹폰트 없음, 시스템 폰트만 */
  --font-display: "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:    "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:    ui-monospace,"SF Mono",Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--font-body);
  background:var(--bg);color:var(--ink);
  font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- 기관 표시줄 (48px, 스크롤 시 고정하지 않음) ---------- */
.gov-bar{
  height:48px;background:var(--brand-deep);color:var(--on-brand);
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:0 20px;font-size:.85rem;
}
.gov-bar .org{font-weight:700;display:flex;align-items:center;min-width:0}
.gov-bar .prog{color:var(--on-brand-muted);font-weight:600;letter-spacing:.08em;white-space:nowrap;display:flex;align-items:center}
/* 왼쪽 기관 로고 — 반전판 이미지라 칩 없이 그대로 올립니다 */
.gov-bar .org img{height:38px;width:auto;max-width:46vw;object-fit:contain}
/* (폴백) 프로그램 로고를 이미지로 쓰는 경우 — 밝은 배경용이라 흰 칩에 올립니다 */
.gov-bar .prog img{
  height:36px;width:auto;max-width:46vw;object-fit:contain;
  background:var(--paper);padding:5px 10px;border-radius:6px;
}
/* AI·D 30+ 집중캠프 — 텍스트 로고 (칩 없이 반전 색감) */
.aid-mark{display:inline-flex;align-items:center;gap:10px;color:var(--on-brand)}
.aid-mark .aid-word{
  position:relative;font-weight:900;font-size:1.2rem;
  letter-spacing:.01em;line-height:1;
}
.aid-mark .aid-word i{
  position:absolute;left:.06em;bottom:-.2em;width:.95em;height:.13em;
  background:var(--hero-accent-2);border-radius:2px;transform:skewX(-24deg);
}
.aid-mark .aid-div{width:1px;height:28px;background:var(--panel-line)}
.aid-mark .aid-lines{display:inline-flex;flex-direction:column;line-height:1.3;text-align:left}
.aid-mark .aid-lines b{font-size:.82rem;font-weight:700;letter-spacing:.03em}
.aid-mark .aid-lines b sup{font-size:.68em}
.aid-mark .aid-lines small{
  font-size:.58rem;font-weight:600;letter-spacing:.16em;
  color:var(--on-brand-muted);
}

/* ---------- 히어로 — 2단 구성: 왼쪽 카피 + 오른쪽 연출 무대 ---------- */
.hero{
  position:relative;overflow:hidden;
  background:var(--brand-deep);color:var(--on-brand);
  padding:56px 24px 48px;
}
/* 무대 배경: 점 격자 + 빔 스윕 */
.stage{position:absolute;inset:0;z-index:1;pointer-events:none}
.grid-dots{
  position:absolute;inset:0;
  background-image:radial-gradient(var(--stage-dot) 1px, transparent 1.4px);
  background-size:26px 26px;
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,.3));
  mask-image:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,.3));
}
.beam{
  position:absolute;top:-45%;height:190%;width:32vw;min-width:300px;left:50%;
  background:linear-gradient(90deg,transparent,var(--beam-a) 45%,var(--beam-b) 58%,transparent);
  filter:blur(36px);mix-blend-mode:screen;
  animation:sweep 28s linear infinite;
}
.beam.b2{width:14vw;min-width:160px;opacity:.65;animation-delay:-14s}
@keyframes sweep{
  from{transform:translateX(-92vw) rotate(14deg)}
  to  {transform:translateX(92vw)  rotate(14deg)}
}
.hero-inner{
  position:relative;z-index:2;
  max-width:1080px;margin:0 auto;
  display:grid;grid-template-columns:1.08fr .92fr;
  align-items:center;gap:44px;
  text-align:left;
}
.hero-copy{min-width:0}
.eyebrow{
  display:inline-block;font-size:.85rem;font-weight:700;
  letter-spacing:.22em;color:var(--hero-accent-1);
}
.hero h1{
  font-family:var(--font-display);
  font-size:clamp(2.4rem,6vw,4.6rem);font-weight:700;
  letter-spacing:-.03em;line-height:1.1;
  margin:12px 0 16px;
  text-shadow:0 0 34px var(--halo-b);
}
/* 강조 줄 — 그라데이션 글자 + 빛 훑기(시머) */
.hero h1 .glow{
  background:linear-gradient(110deg,var(--hero-accent-1) 18%,var(--hero-accent-2) 38%,var(--hero-accent-3) 50%,var(--hero-accent-2) 62%,var(--hero-accent-1) 82%);
  background-size:230% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  display:inline-block;opacity:0;transform:translateY(24px);
  animation:rise .6s .38s cubic-bezier(.2,.7,.3,1) both,
            shimmer 7s ease-in-out 1.6s infinite;
}
@keyframes shimmer{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
.hero-sub{font-size:1rem;color:var(--on-brand-muted);max-width:560px}
.hero-sub b{color:var(--on-brand);font-weight:700}

/* 모션 — 단어별 등장 · 요소 등장 */
.w{display:inline-block;opacity:0;transform:translateY(24px);
  animation:rise .6s cubic-bezier(.2,.7,.3,1) both}
.fx{opacity:0;transform:translateY(14px);
  animation:rise .6s .7s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* 타이핑 카드 — 문구는 ITEMS의 prompt·제목에서 생성 */
.prompt-line{
  max-width:520px;margin:24px 0 0;
  background:var(--glass-bg);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--glass-line);
  border-radius:12px;padding:13px 18px;text-align:left;
  font-size:.95rem;color:var(--on-brand);
  display:flex;align-items:flex-start;gap:10px;
  opacity:0;
  animation:rise .6s .8s cubic-bezier(.2,.7,.3,1) both,
            floatY 6s ease-in-out 1.8s infinite;
}
.prompt-line .mark{color:var(--hero-accent-2);font-weight:900}
.prompt-line .typed{min-height:1.7em}
.caret{display:inline-block;width:2px;height:1.05em;
  margin-top:.35em;flex:none;
  background:var(--hero-accent-1);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- 오른쪽 연출: 디지털 닷 스피어 + 글래스 연꽃 ---------- */
.hero-visual{position:relative;display:flex;justify-content:center;align-items:flex-end;min-height:280px}
.globe{
  position:absolute;left:50%;top:46%;
  width:380px;height:380px;
  transform:translate(-50%,-50%);
  pointer-events:none;opacity:.9;
}
/* AI.D 30+ 글래스 블룸 — 글자가 각자 피어올랐다가 하나로 만납니다 */
.aid-bloom{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:10px;
  height:255px;padding-bottom:26px;
  animation:floatY 8s ease-in-out 2s infinite;
}
.aid-bloom::before{ /* 후광 */
  content:"";position:absolute;left:50%;top:46%;width:300px;height:300px;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,var(--halo-a) 0%,var(--halo-b) 45%,transparent 70%);
  filter:blur(6px);
}
/* 글자 자체가 투명한 유리 — 반투명 그라데이션 채움 + 옅은 유리 윤곽선 + 글로우 */
.glyph{
  font-family:var(--font-display);font-weight:900;
  font-size:4.4rem;line-height:1;
  background:linear-gradient(180deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,.13) 55%,rgba(255,255,255,.32) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:1px var(--petal-front-line);
  filter:drop-shadow(0 10px 22px rgba(8,18,40,.5)) drop-shadow(0 0 18px var(--beam-a));
  /* 흩어짐 좌표(--dx·--dy)·지연(--d)·기울기(--rot)는 마크업에서, 패턴은 .aid-bloom의 p1~p3 클래스가 결정 */
  --dx:0px; --dy:-80px; --d:0s; --rot:0deg;
  opacity:0;
}
.glyph.num{font-size:3.2rem}
.glyph.plus{
  font-size:2.6rem;
  margin-left:-8px;   /* 30 바로 뒤, 같은 줄에 "30+" 로 표시 */
  background:linear-gradient(180deg,rgba(140,243,223,.85) 0%,rgba(94,234,212,.28) 60%,rgba(140,243,223,.55) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:1px var(--hero-accent-2);
  filter:drop-shadow(0 0 18px var(--halo-a)) drop-shadow(0 6px 14px rgba(8,18,40,.4));
}
/* 패턴별 재생 — JS가 사이클마다 p1→p2→p3 클래스를 순환시킵니다 */
.aid-bloom.p1 .glyph{animation:glyphRise  7s ease-in-out both;animation-delay:var(--d)}
.aid-bloom.p2 .glyph{animation:glyphOrbit 7s ease-in-out both;animation-delay:var(--d)}
.aid-bloom.p3 .glyph{animation:glyphDepth 7s ease-in-out both;animation-delay:var(--d)}

/* 패턴 ① 아래에서 피어올라 수평으로 흩어졌다가 모임 (기존) */
@keyframes glyphRise{
  0%{opacity:0;transform:translate(calc(var(--dx) * 1.8), 52px) rotate(var(--rot)) scale(.6)}
  13%{opacity:1;transform:translate(var(--dx), 6px) rotate(calc(var(--rot) * .3)) scale(1)}
  32%,80%{opacity:1;transform:translate(0, 0) rotate(0deg) scale(1)}
  94%,100%{opacity:0;transform:translate(calc(var(--dx) * 1.2), 44px) rotate(var(--rot)) scale(.7)}
}
/* 패턴 ② 사방에서 회전하며 날아와 만나고, 반대편으로 흩어짐 */
@keyframes glyphOrbit{
  0%{opacity:0;transform:translate(calc(var(--dx) * 2.4), var(--dy)) rotate(calc(var(--rot) * 6)) scale(.5)}
  16%{opacity:1;transform:translate(calc(var(--dx) * .9), calc(var(--dy) * .3)) rotate(calc(var(--rot) * 2)) scale(1.06)}
  36%,80%{opacity:1;transform:translate(0, 0) rotate(0deg) scale(1)}
  94%,100%{opacity:0;transform:translate(calc(var(--dx) * -1.4), calc(var(--dy) * -.7)) rotate(calc(var(--rot) * -3)) scale(.55)}
}
/* 패턴 ③ 멀리서 크게 떠올랐다가 줌인되며 제자리에서 만남 */
@keyframes glyphDepth{
  0%{opacity:0;transform:translate(calc(var(--dx) * .8), calc(var(--dy) * .5)) scale(2.6)}
  18%{opacity:.9;transform:translate(calc(var(--dx) * .25), 0) scale(1.4)}
  38%,80%{opacity:1;transform:translate(0, 0) scale(1)}
  94%,100%{opacity:0;transform:scale(.25)}
}
.ripple{
  position:absolute;left:50%;border:1px solid var(--ripple-line);
  border-radius:50%;transform:translateX(-50%) scaleY(.32);
  opacity:0;--o:1;
  animation:rippleIn 1s 2s ease both;
}
@keyframes rippleIn{to{opacity:var(--o)}}
.r1{bottom:22px;width:220px;height:52px}
.r2{bottom:12px;width:300px;height:64px;--o:.5}

@media (max-width:900px){
  .hero-inner{grid-template-columns:1fr;text-align:center;gap:10px}
  .hero-sub{margin:0 auto}
  .prompt-line{margin:24px auto 0}
  .hero-visual{margin-top:22px;min-height:0}
  .aid-bloom{transform:scale(.72);transform-origin:bottom center;margin-bottom:-30px;animation:none}
  .globe{width:340px;height:340px}
}

/* 감속 설정 — 모든 연출을 최종 상태로 즉시 표시 */
@media (prefers-reduced-motion: reduce){
  .w,.fx,.hero h1 .glow{animation:none;opacity:1;transform:none}
  .caret{animation:none}
  .beam{animation:none}
  .prompt-line{animation:none;opacity:1}
  .aid-bloom{animation:none}
  .glyph{animation:none;opacity:1;transform:none}
  .ripple{animation:none;opacity:var(--o)}
}

/* ---------- 작품 목록 ---------- */
.works{max-width:1200px;width:100%;margin:0 auto;padding:0 20px 64px}
.toolbar{
  display:flex;justify-content:space-between;align-items:flex-end;
  gap:12px 16px;flex-wrap:wrap;padding:36px 0 16px;
}
.section-title{font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
.section-title small{display:block;font-size:.82rem;font-weight:400;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filter-btn{
  border:1px solid var(--line);background:var(--paper);color:var(--muted);
  font-size:.85rem;font-weight:500;min-height:44px;padding:8px 16px;
  border-radius:var(--radius);
  transition:border-color .15s ease, color .15s ease;
}
.filter-btn:hover{border-color:var(--brand);color:var(--brand)}
.filter-btn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:700}

/* ---------- 갤러리 그리드 (4열 → 2열 → 1열) ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:1020px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}

/* 카드 — 전체가 하나의 버튼 */
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;text-align:left;display:flex;flex-direction:column;
  box-shadow:var(--shadow-card);
  transition:transform .15s ease, box-shadow .15s ease;
}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-card-hover)}  /* 모션 3 */
.thumb{
  width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;
  background:var(--brand-tint);
  display:flex;align-items:center;justify-content:center;
}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.thumb-emoji{font-size:44px;line-height:1}
/* 영상이 있는 카드 — 재생 삼각형 (인라인 SVG, 반투명 원) */
.play-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.play-badge svg{width:44px;height:44px}
.play-badge .pb-c{fill:var(--overlay-bg)}
.play-badge .pb-t{fill:var(--on-brand)}
.label{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.card-title{font-size:1.05rem;font-weight:600;line-height:1.45;color:var(--ink)}
.byline{font-size:.82rem;color:var(--muted)}
.meta-row{margin-top:auto;padding-top:10px;display:flex;align-items:center;gap:8px}
.badge{font-size:.82rem;color:var(--muted);letter-spacing:.02em}
/* 링크 보유 아이콘 3개 — 보유/미보유를 색·투명도 + title·aria 텍스트로 함께 표시 */
.link-state{margin-left:auto;display:flex;gap:5px}
.lk{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px}
.lk svg{width:15px;height:15px}
.lk.on{color:var(--brand)}
.lk.off{color:var(--line);opacity:.7}
.empty{padding:48px 0;text-align:center;color:var(--muted)}

/* ---------- 도록형 작품 카드 (모달) ---------- */
body.modal-open{overflow:hidden}
.overlay{
  position:fixed;inset:0;background:var(--overlay-bg);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:50;
}
.overlay.show{display:flex;animation:fadeIn .18s ease}
.placard{
  background:var(--paper);border-radius:10px;max-width:600px;width:100%;
  max-height:90vh;overflow:auto;
  box-shadow:var(--shadow-modal);
  animation:placardIn .22s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes placardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* 감속 설정·자동 전시 — 이동 없이 페이드만 */
@media (prefers-reduced-motion: reduce){
  .placard{animation:fadeIn .18s ease}
}
.overlay.auto .placard{animation:fadeIn .28s ease}
.placard-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 8px 8px 22px;border-bottom:1px solid var(--line);
}
.p-badge{font-size:.82rem;font-weight:700;letter-spacing:.08em;color:var(--brand)}
.p-close{
  width:44px;height:44px;border:none;background:none;color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius);
}
.p-close:hover{color:var(--ink);background:var(--brand-tint)}
.p-close svg{width:18px;height:18px}
.placard-title-block{padding:18px 22px 0}
.placard h2{font-size:1.4rem;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.placard .artist{font-size:.9rem;color:var(--muted);margin-top:2px}
.placard .artist b{color:var(--ink)}
.p-thumb{margin:16px 22px 0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.p-thumb .thumb-emoji{font-size:60px}
/* 영상 재생 화면 — 세로(쇼츠) 영상은 검은 여백과 함께 가운데 표시 */
.player{position:relative;width:100%;aspect-ratio:16/9;background:var(--brand-deep)}
.player iframe,.player video{position:absolute;inset:0;width:100%;height:100%;border:0}
.player video{object-fit:contain}
.spec{margin:18px 22px 0;border-top:2px solid var(--brand)}
.spec-row{display:grid;grid-template-columns:96px 1fr;border-bottom:1px solid var(--line)}
.spec-row dt{
  background:var(--brand-tint);color:var(--brand);
  font-size:.82rem;font-weight:700;letter-spacing:.04em;
  padding:12px;display:flex;align-items:flex-start;
}
.spec-row dd{font-size:.9rem;padding:12px 14px;white-space:pre-line}
/* 모노는 「어떻게 시켰나」 칸에만 — 요청문이 '적어 낸 말'로 보이게 */
.spec-row dd.mono{font-family:var(--font-mono);font-size:.85rem;background:var(--bg)}
@media (max-width:680px){.spec-row{grid-template-columns:82px 1fr}}
.placard-actions{display:flex;gap:10px;flex-wrap:wrap;padding:20px 22px 24px}
.btn{
  border:1px solid var(--line);border-radius:var(--radius);
  font-size:.95rem;font-weight:700;min-height:48px;padding:10px 20px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  text-decoration:none;background:var(--paper);color:var(--ink);
  transition:background .15s ease, border-color .15s ease;
}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);flex:1;min-width:160px}
.btn-primary:hover{background:var(--brand-deep)}
.btn:not(.btn-primary):not(:disabled):hover{border-color:var(--muted)}
.btn:disabled{cursor:not-allowed;color:var(--muted);background:var(--bg);font-weight:500}

/* ---------- 푸터 ---------- */
footer{
  background:var(--brand-deep);color:var(--on-brand-muted);
  padding:30px 20px;text-align:center;font-size:.82rem;line-height:1.9;
}
footer .org{color:var(--on-brand);font-weight:700;font-size:.9rem}
/* 푸터 기관 로고 스트립 — 흰 칩 위에 표시 */
.footer-logos{
  display:flex;justify-content:center;align-items:center;
  gap:10px;flex-wrap:wrap;margin-bottom:18px;
}
.footer-logos .logo-chip{
  background:var(--paper);border-radius:6px;
  padding:6px 12px;display:inline-flex;align-items:center;
}
.footer-logos img{height:30px;width:auto;max-width:190px;object-fit:contain}

/* ---------- noscript ---------- */
.noscript-note{padding:48px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>

<!-- ================= 기관 표시줄 ================= -->
<div class="gov-bar">
  <span class="org" id="orgSlot"></span>
  <span class="prog" id="progSlot"></span>
</div>

<!-- ================= 히어로 ================= -->
<header class="hero">
  <div class="stage" aria-hidden="true">
    <div class="grid-dots"></div>
    <div class="beam b1"></div>
    <div class="beam b2"></div>

    <div class="hero-copy">

      <h1 id="titleSlot"></h1>

        <span class="glyph"      style="--dx:-42px;--dy:64px;--d:.3s;--rot:-6deg">I</span>
        <span class="glyph"      style="--dx:-14px;--dy:-58px;--d:.45s;--rot:3deg">D</span>

        <span class="glyph plus" style="--dx:78px;--dy:56px;--d:.9s;--rot:12deg">+</span>
      </div>

</header>

<!-- ================= 작품 목록 ================= -->
<main class="works">
  <div class="toolbar">
    <h2 class="section-title" id="sectionTitleSlot"></h2>
    <div class="filters" id="filters" role="group" aria-label="보기 선택"></div>
  </div>
  <div class="grid" id="grid"></div>

</main>

<!-- ================= 도록형 작품 카드 (모달) ================= -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <article class="placard">
    <div class="placard-head">
      <span class="p-badge" id="pBadge"></span>
      <button class="p-close" id="pClose" aria-label="소개 카드 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="placard-title-block">
      <h2 id="pTitle"></h2>
      <p class="artist" id="pArtist"></p>
    </div>
    <div class="p-thumb" id="pThumb"></div>
    <dl class="spec" id="pSpec"></dl>
    <div class="placard-actions" id="pActions"></div>
  </article>
</div>

<!-- ================= 푸터 ================= -->
<footer id="footerSlot"></footer>

<noscript><p class="noscript-note">이 페이지는 자바스크립트로 작품 목록을 표시합니다. 브라우저에서 자바스크립트를 켠 뒤 새로고침해 주세요.</p></noscript>

<script src="data/items.js"></script>
<script>
/* ============================================================
   렌더링 엔진 — 데이터는 data/items.js 에서만 옵니다
============================================================ */
const $ = id => document.getElementById(id);

/* ---------- 기관 표시줄 ---------- */
(function(){
  const slot = $("orgSlot");
  if (SITE.orgLogo){
    const img = new Image();
    img.src = SITE.orgLogo;
    img.alt = SITE.orgName;
    /* 로고 파일이 아직 없으면 기관명 텍스트로 대체 */
    img.onerror = () => { img.remove(); slot.textContent = SITE.orgName; };
    slot.appendChild(img);
  } else {
    slot.textContent = SITE.orgName;
  }
  const prog = $("progSlot");
  if (SITE.programMark){
    /* 텍스트 로고 — 어두운 바 위 반전 색감 */
    prog.innerHTML =
      `<span class="aid-mark" role="img" aria-label="${SITE.programName}">` +
      `<b class="aid-word">${SITE.programMark.main}<i aria-hidden="true"></i></b>` +
      `<span class="aid-div" aria-hidden="true"></span>` +
      `<span class="aid-lines"><b>${SITE.programMark.sub1}</b><small>${SITE.programMark.sub2}</small></span>` +
      `</span>`;
  } else if (SITE.programLogo){
    const pimg = new Image();
    pimg.src = SITE.programLogo;
    pimg.alt = SITE.programName;
    pimg.onerror = () => { pimg.remove(); prog.textContent = SITE.programName; };
    prog.appendChild(pimg);
  } else {
    prog.textContent = SITE.programName;
  }
})();

/* ---------- 감속 설정 ---------- */
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- 히어로 ---------- */
$("eyebrowSlot").textContent = SITE.eyebrow;
$("titleSlot").innerHTML =
  SITE.titleWords.map((w, i) =>
    `<span class="w" style="animation-delay:${(0.10 + i * 0.14).toFixed(2)}s">${w}</span>`
  ).join(" ") +
  `<br><span class="glow">${SITE.titleGlow}</span>`;
$("subSlot").innerHTML = SITE.subHTML;

/* ---------- 타이핑 카드 — 과정 홍보 문구 순환 (SITE.prompts) ---------- */
(function typing(){
  const el = $("typeText");
  const phrases = (SITE.prompts && SITE.prompts.length)
    ? SITE.prompts
    : ITEMS.map(it => (it.prompt || "").split("\n")[0].trim() || it.title).filter(Boolean);
  if (!el || !phrases.length) return;
  if (REDUCED) { el.textContent = phrases[0]; return; }   /* 최종 상태 즉시 표시 */
  let pi = 0, ci = 0, del = false;
  (function tick(){
    const t = phrases[pi];
    ci += del ? -1 : 1;
    el.textContent = t.slice(0, ci);
    if (!del && ci === t.length) { del = true; setTimeout(tick, 1700); return; }
    if (del && ci === 0) { del = false; pi = (pi + 1) % phrases.length; }
    setTimeout(tick, del ? 30 : 90);
  })();
})();

/* ---------- AI.D 30+ 블룸 패턴 순환 — 사이클마다 p1→p2→p3 ---------- */
(function bloomPatterns(){
  const bloom = document.querySelector(".aid-bloom");
  if (!bloom || REDUCED) return;   /* 감속 설정: 조립 완료 상태 고정 (CSS) */
  const patterns = ["p1", "p2", "p3"];
  let pi = 0;
  bloom.classList.add(patterns[0]);
  /* 한 사이클 = 재생 7.9초(7s + 최대 지연 .9s) + 여백 → 8.2초마다 다음 패턴 */
  setInterval(() => {
    bloom.classList.remove(patterns[pi % patterns.length]);
    pi++;
    void bloom.offsetWidth;   /* 리플로로 애니메이션 재시작 */
    bloom.classList.add(patterns[pi % patterns.length]);
  }, 8200);
})();

/* ---------- 디지털 닷 스피어 — 점으로 된 구가 연꽃 뒤에서 천천히 자전 ---------- */
(function(){
  const cv = $("globe");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  /* 색은 :root 토큰에서 읽어 옵니다 */
  const rgbOf = name => {
    const h = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const n = parseInt(h.slice(1), 16);
    return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`;
  };
  const BLUE = rgbOf("--hero-accent-1"), TEAL = rgbOf("--hero-accent-2");
  let raf = null, th = 0;

  const N = 720, TILT = -0.21, SPEED = 0.0016;
  const GA = Math.PI * (3 - Math.sqrt(5));
  const pts = [];
  for (let i = 0; i < N; i++){
    const y = 1 - (i / (N - 1)) * 2;
    const r = Math.sqrt(1 - y * y);
    const a = GA * i;
    pts.push({ x: Math.cos(a) * r, y, z: Math.sin(a) * r,
               tw: Math.random() * 6.283, teal: i % 9 === 0 });
  }
  function size(){
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * DPR; cv.height = h * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  function frame(){
    const w = cv.clientWidth, h = cv.clientHeight;
    const cx = w / 2, cy = h / 2, R = w * 0.42;
    ctx.clearRect(0, 0, w, h);
    const halo = ctx.createRadialGradient(cx, cy, R * .55, cx, cy, R * 1.25);
    halo.addColorStop(0, `rgba(${BLUE},0)`);
    halo.addColorStop(.75, `rgba(${BLUE},.10)`);
    halo.addColorStop(1, `rgba(${BLUE},0)`);
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, w, h);
    const cosT = Math.cos(th), sinT = Math.sin(th);
    const cosK = Math.cos(TILT), sinK = Math.sin(TILT);
    const t = performance.now() * 0.001;
    for (const p of pts){
      const x1 = p.x * cosT + p.z * sinT;
      const z1 = -p.x * sinT + p.z * cosT;
      const x2 = x1 * cosK - p.y * sinK;
      const y2 = x1 * sinK + p.y * cosK;
      const sx = cx + x2 * R, sy = cy + y2 * R;
      const depth = (z1 + 1) / 2;
      const twk = REDUCED ? 1 : .85 + Math.sin(t * 1.4 + p.tw) * .15;
      const alpha = ((0.10 + depth * 0.75) * twk).toFixed(3);
      ctx.fillStyle = `rgba(${p.teal ? TEAL : BLUE},${alpha})`;
      ctx.beginPath();
      ctx.arc(sx, sy, 0.7 + depth * 1.25, 0, 6.283);
      ctx.fill();
    }
  }
  function step(){ th += SPEED; frame(); raf = requestAnimationFrame(step); }
  function start(){ if (!raf && !REDUCED) raf = requestAnimationFrame(step); }
  function stop(){ cancelAnimationFrame(raf); raf = null; }
  window.addEventListener("resize", () => { size(); if (REDUCED) frame(); });
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());
  size();
  if (REDUCED) frame();   /* 감속 설정: 자전 없이 정지 화면 한 장 */
  else start();
})();

/* ============================================================
   작품 갤러리
============================================================ */
const el = (tag, cls) => { const n = document.createElement(tag); if (cls) n.className = cls; return n; };
const pad2 = n => String(n).padStart(2, "0");

/* 링크 상태 아이콘 — 인라인 SVG 3종 (앱·영상·자료) */
const ICONS = {
  app:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>',
  video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m10 9 5 3-5 3z" fill="currentColor" stroke="none"/></svg>',
  extra: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
};
const LINK_LABEL = { app: "배포 링크", video: "시연 영상", extra: "기타 자료" };

$("sectionTitleSlot").innerHTML = `${SITE.sectionTitle}<small>${SITE.sectionHint}</small>`;

/* 유튜브 주소 4형태에서 영상 ID 추출: youtu.be/ID · watch?v=ID · shorts/ID · embed/ID */
function ytId(url){
  if (!url) return "";
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{6,})/);
  return m ? m[1] : "";
}

function playBadge(){
  const s = el("span", "play-badge");
  s.innerHTML = '<svg viewBox="0 0 48 48" aria-hidden="true"><circle class="pb-c" cx="24" cy="24" r="21"/><path class="pb-t" d="M19.5 15.5 34 24l-14.5 8.5z"/></svg>';
  return s;
}

/* 썸네일 우선순위 (명세 7절): ① item.image → ② 유튜브 hqdefault → ③ 이모지 카드
   maxresdefault는 영상에 따라 404가 나므로 쓰지 않습니다.
   유튜브 썸네일은 외부 자원 — 실패하면 onerror로 이모지 카드까지 떨어집니다. */
function makeThumb(item){
  const wrap = el("span", "thumb");
  const yid = ytId(item.links.video);
  const showEmoji = () => {
    wrap.textContent = "";
    const e = el("span", "thumb-emoji");
    e.textContent = item.emoji || "🧩";
    e.setAttribute("aria-hidden", "true");
    wrap.appendChild(e);
    if (yid) wrap.appendChild(playBadge());
  };
  const sources = [];
  if (item.image) sources.push(item.image);
  if (yid) sources.push(`https://img.youtube.com/vi/${yid}/hqdefault.jpg`);
  if (!sources.length){ showEmoji(); return wrap; }
  let si = 0;
  const img = new Image();
  img.alt = item.title;
  img.onerror = () => { si++; si < sources.length ? (img.src = sources[si]) : showEmoji(); };
  img.src = sources[0];
  wrap.appendChild(img);
  if (yid) wrap.appendChild(playBadge());
  return wrap;
}

function linkStateHTML(item){
  return `<span class="link-state">` + ["app", "video", "extra"].map(k => {
    const has = !!item.links[k];
    return `<span class="lk ${has ? "on" : "off"}" title="${LINK_LABEL[k]} ${has ? "있음" : "없음"}">${ICONS[k]}</span>`;
  }).join("") + `</span>`;
}
function linkStateText(item){
  return ["app", "video", "extra"]
    .map(k => `${LINK_LABEL[k]} ${item.links[k] ? "있음" : "없음"}`).join(", ");
}

const grid = $("grid");

function makeCard(item){
  const card = el("button", "card");
  card.setAttribute("aria-haspopup", "dialog");
  card.setAttribute("aria-label",
    `${SITE.badge(item.cohort, item.no)} ${item.title} — ${item.group} ${item.author}. ${linkStateText(item)}. 소개 카드 열기`);
  card.appendChild(makeThumb(item));
  const label = el("span", "label");
  const title = el("span", "card-title"); title.textContent = item.title;
  const by = el("span", "byline"); by.textContent = `${item.group} · ${item.author}`;
  const meta = el("span", "meta-row");
  const badge = el("span", "badge"); badge.textContent = SITE.badge(item.cohort, item.no);
  meta.appendChild(badge);
  meta.insertAdjacentHTML("beforeend", linkStateHTML(item));
  label.append(title, by, meta);
  card.appendChild(label);
  card.addEventListener("click", () => requestOpen(item));
  return card;
}

/* ---------- 정렬: 기수 내림차순(최신 먼저) → 번호 오름차순 ----------
   배열 순서에 의존하지 않습니다 */
const cohortRank = key => {
  const i = COHORTS.findIndex(c => c.key === key);
  return i < 0 ? COHORTS.length : i;
};
const SORTED = [...ITEMS].sort((a, b) =>
  cohortRank(a.cohort) - cohortRank(b.cohort) || a.no - b.no);

/* (기수, 번호) 조합 중복 경고 */
(function(){
  const seen = new Set();
  ITEMS.forEach(it => {
    const k = `${it.cohort}-${it.no}`;
    if (seen.has(k)) console.warn(`ITEMS: 기수·번호 중복 — ${k} (${it.title})`);
    seen.add(k);
  });
})();

/* ---------- 보기 선택 — 바이브코딩(작품) / 영상 ---------- */
const filtersEl = $("filters");
const VIDEO_LIST = (typeof VIDEOS !== "undefined" && Array.isArray(VIDEOS)) ? VIDEOS : [];
const MODES = [
  { key: "app",   label: "바이브코딩" },
  { key: "video", label: "영상" },
];
let mode = "app";

function buildFilters(){
  filtersEl.textContent = "";
  MODES.forEach(m => {
    const b = el("button", "filter-btn");
    b.textContent = m.label;
    b.setAttribute("aria-pressed", String(m.key === mode));
    b.addEventListener("click", () => {
      mode = m.key;
      filtersEl.querySelectorAll(".filter-btn").forEach(x => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      render();   /* 전환은 URL을 바꾸지 않습니다 */
    });
    filtersEl.appendChild(b);
  });
}

/* 영상 카드 — 유튜브 링크(썸네일 자동) 또는 직접 올린 파일(첫 화면 미리보기) */
function makeVideoCard(v, i){
  const card = el("button", "card");
  card.setAttribute("aria-haspopup", "dialog");
  card.setAttribute("aria-label",
    `영상 ${pad2(i + 1)} ${v.title} — ${[v.group, v.author].filter(Boolean).join(" ")}. 재생 카드 열기`);
  const wrap = el("span", "thumb");
  const yid = ytId(v.youtube);
  const showEmoji = () => {
    wrap.textContent = "";
    const e = el("span", "thumb-emoji");
    e.textContent = "🎬";
    e.setAttribute("aria-hidden", "true");
    wrap.appendChild(e);
    wrap.appendChild(playBadge());
  };
  if (yid){
    const img = new Image();
    img.alt = v.title;
    img.onerror = showEmoji;
    img.src = `https://img.youtube.com/vi/${yid}/hqdefault.jpg`;
    wrap.appendChild(img);
    wrap.appendChild(playBadge());
  } else if (v.file){
    const vid = document.createElement("video");
    vid.src = v.file;
    vid.muted = true; vid.preload = "metadata"; vid.playsInline = true;
    vid.onerror = showEmoji;
    wrap.appendChild(vid);
    wrap.appendChild(playBadge());
  } else {
    showEmoji();
  }
  card.appendChild(wrap);
  const label = el("span", "label");
  const title = el("span", "card-title"); title.textContent = v.title;
  const by = el("span", "byline"); by.textContent = [v.group, v.author].filter(Boolean).join(" · ");
  const meta = el("span", "meta-row");
  const badge = el("span", "badge"); badge.textContent = `영상 ${pad2(i + 1)}`;
  meta.appendChild(badge);
  label.append(title, by, meta);
  card.appendChild(label);
  card.addEventListener("click", () => openVideo(v));
  return card;
}

function render(){
  grid.textContent = "";
  if (mode === "app"){
    SORTED.forEach(item => grid.appendChild(makeCard(item)));
    $("empty").textContent = "작품이 준비 중입니다.";
  } else {
    VIDEO_LIST.forEach((v, i) => grid.appendChild(makeVideoCard(v, i)));
    $("empty").textContent = "영상이 준비 중입니다.";
  }
  $("empty").hidden = grid.children.length > 0;
}
buildFilters();
render();

/* ---------- 도록형 작품 카드 (모달) ---------- */
const overlay = $("overlay");
let lastFocus = null;
let openItem = null;

function specRow(label, text, mono){
  const row = el("div", "spec-row");
  const dt = el("dt"); dt.textContent = label;
  const dd = el("dd"); if (mono) dd.className = "mono";
  dd.textContent = text;
  row.append(dt, dd);
  return row;
}

function openPlacard(item, opts){
  const silent = opts && opts.silent;   /* 자동 전시 모드: 포커스를 건드리지 않음 */
  openItem = item;
  if (!silent) lastFocus = document.activeElement;
  $("pBadge").textContent = SITE.badge(item.cohort, item.no);
  $("pTitle").textContent = item.title;
  $("pArtist").innerHTML = SITE.artistLine(item);
  const pt = $("pThumb"); pt.textContent = ""; pt.appendChild(makeThumb(item));
  const spec = $("pSpec"); spec.textContent = "";
  spec.appendChild(specRow(SITE.labelTopic, item.topic));
  if (item.usage) spec.appendChild(specRow(SITE.labelUsage, item.usage));
  /* prompt가 비면 칸 전체(라벨 포함)를 렌더하지 않습니다 (명세 8절) */
  if (item.prompt) spec.appendChild(specRow(SITE.labelPrompt, item.prompt, true));
  spec.hidden = false;
  const act = $("pActions"); act.textContent = "";
  act.hidden = false;
  ["app", "video", "extra"].forEach(k => {
    const url = item.links[k];
    if (url){
      const a = el("a", "btn" + (k === "app" ? " btn-primary" : ""));
      a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = SITE.linkText[k];
      act.appendChild(a);
    } else {
      /* 링크가 없으면 숨기지 않고 비활성 + 안내 문구 */
      const b = el("button", "btn");
      b.disabled = true;
      b.textContent = SITE.linkNone[k];
      act.appendChild(b);
    }
  });
  overlay.classList.add("show");
  document.body.classList.add("modal-open");
  if (!silent) $("pClose").focus();
}

function closePlacard(opts){
  if (!openItem) return;
  openItem = null;
  overlay.classList.remove("show");
  document.body.classList.remove("modal-open");
  $("pThumb").textContent = "";   /* 재생 중인 영상·플레이어 정지 */
  if (!(opts && opts.silent) && lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

/* ---------- 영상 재생 카드 — 유튜브 임베드 또는 파일 재생 ---------- */
function openVideo(v){
  openItem = v;
  lastFocus = document.activeElement;
  $("pBadge").textContent = "영상";
  $("pTitle").textContent = v.title;
  $("pArtist").innerHTML = (v.group || v.author)
    ? `<b>${[v.group, v.author].filter(Boolean).join(" ")} 대표님</b>의 영상입니다.`
    : "";
  const pt = $("pThumb"); pt.textContent = "";
  const yid = ytId(v.youtube);
  const player = el("div", "player");
  if (yid){
    const f = document.createElement("iframe");
    f.src = `https://www.youtube.com/embed/${yid}`;
    f.title = v.title;
    f.allow = "autoplay; encrypted-media; picture-in-picture";
    f.allowFullscreen = true;
    player.appendChild(f);
  } else if (v.file){
    const vid = document.createElement("video");
    vid.src = v.file;
    vid.controls = true;
    vid.playsInline = true;
    player.appendChild(vid);
  }
  pt.appendChild(player);
  const spec = $("pSpec"); spec.textContent = "";
  if (v.desc) spec.appendChild(specRow("영상 소개", v.desc));
  spec.hidden = !spec.children.length;
  const act = $("pActions"); act.textContent = "";
  if (yid){
    const a = el("a", "btn btn-primary");
    a.href = v.youtube; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.textContent = "유튜브에서 보기 ↗";
    act.appendChild(a);
  }
  act.hidden = !act.children.length;
  overlay.classList.add("show");
  document.body.classList.add("modal-open");
  $("pClose").focus();
}

$("pClose").addEventListener("click", requestClose);
overlay.addEventListener("click", e => { if (e.target === overlay) requestClose(); });
document.addEventListener("keydown", e => {
  if (!overlay.classList.contains("show")) return;
  if (e.key === "Escape"){ requestClose(); return; }
  if (e.key === "Tab"){
    /* 포커스 트랩 — 카드가 열린 동안 Tab이 배경으로 나가지 않게 */
    const f = overlay.querySelectorAll('a[href], button:not([disabled])');
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last){ first.focus(); e.preventDefault(); }
    else if (!overlay.contains(document.activeElement)){ first.focus(); e.preventDefault(); }
  }
});

/* ---------- 딥링크 — #w-기수-번호 (예: #w-1-07) ----------
   카드 클릭 → 주소 변경 → hashchange가 모달을 엽니다.
   공유한 주소로 접속하면 해당 모달이 열린 상태로 시작하고, 뒤로가기로 닫힙니다. */
const hashOf = item => `#w-${item.cohort}-${pad2(item.no)}`;
function itemByHash(h){
  const m = /^#w-(.+)-(\d+)$/.exec(h);
  if (!m) return null;
  return ITEMS.find(it => it.cohort === m[1] && it.no === Number(m[2])) || null;
}
function requestOpen(item){
  if (openItem === item) return;
  location.hash = hashOf(item);
}
function requestClose(){
  /* 주소에 작품 해시가 있으면 뒤로가기로 주소까지 함께 되돌립니다 */
  if (itemByHash(location.hash)) history.back();
  else closePlacard();
}
function syncFromHash(){
  const item = itemByHash(location.hash);
  if (item) openPlacard(item);
  else closePlacard();
}
window.addEventListener("hashchange", syncFromHash);
syncFromHash();

/* ---------- 자동 전시 모드 — 행사장 대형 화면 대응 ----------
   무조작 idleMs 경과 → 앱 링크가 있는 작품만 순환하며 모달을 자동으로 엽니다.
   마우스·키보드·터치·스크롤 중 무엇이든 감지되면 즉시 해제합니다.
   감속 설정과 무관하게 동작하되 전환은 페이드만 씁니다.
   순환 대상이 5개 미만이면 켜지 않습니다 (명세 8절). */
(function autoMode(){
  const linked = SORTED.filter(it => it.links.app);
  if (linked.length < 5) return;
  let idleTimer = null, stepTimer = null, on = false, idx = 0;

  function start(){
    if (on || openItem) return;   /* 이미 열려 있는 카드 위에 겹치지 않음 */
    on = true;
    overlay.classList.add("auto");
    (function cycle(){
      if (!on) return;
      openPlacard(linked[idx % linked.length], { silent: true });   /* 주소는 바꾸지 않습니다 */
      idx++;
      stepTimer = setTimeout(() => {
        if (!on) return;
        closePlacard({ silent: true });
        stepTimer = setTimeout(cycle, SITE.gapMs);
      }, SITE.showMs);
    })();
  }
  function stop(){
    clearTimeout(stepTimer);
    if (on){
      on = false;
      overlay.classList.remove("auto");
      closePlacard({ silent: true });
    }
    resetIdle();
  }
  function resetIdle(){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(start, SITE.idleMs);
  }
  ["pointerdown", "pointermove", "keydown", "wheel", "touchstart", "scroll"]
    .forEach(ev => window.addEventListener(ev, stop, { passive: true }));
  resetIdle();
})();

/* ---------- 푸터 — 기관 로고 스트립 + 문구 ---------- */
(function(){
  const logos = (SITE.footerLogos || [])
    .map(l => `<span class="logo-chip"><img src="${l.src}" alt="${l.alt}" onerror="this.parentNode.remove()"></span>`)
    .join("");
  $("footerSlot").innerHTML =
    (logos ? `<div class="footer-logos">${logos}</div>` : "") +
    SITE.footerLines.map(l => `<div>${l}</div>`).join("");
})();
