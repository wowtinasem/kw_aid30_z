<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>og-card — 링크 미리보기 카드 (img/og.png 원본, 1200×630 캡처용)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:1200px;height:630px;overflow:hidden;position:relative;
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:#FFFFFF;
  background:
    radial-gradient(rgba(140,180,255,.16) 1.2px, transparent 1.6px),
    radial-gradient(880px 520px at 84% 30%, rgba(90,160,255,.20), transparent 65%),
    radial-gradient(680px 420px at 78% 42%, rgba(94,234,212,.11), transparent 60%),
    #0E1726;
  background-size:30px 30px, auto, auto, auto;
}
.wrap{position:absolute;inset:0;padding:60px 80px;display:flex;flex-direction:column;justify-content:space-between}
.logo{height:56px;width:auto;align-self:flex-start}
h1{font-weight:800;letter-spacing:-.02em;line-height:1.16}
h1 .u{display:block;font-size:56px;color:#FFFFFF}
h1 .p{
  display:block;font-size:76px;margin-top:6px;
  background:linear-gradient(100deg,#7FB8FF 8%,#5EEAD4 55%,#EAF6FF 95%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{margin-top:20px;font-size:27px;color:#C7CEDA}
.sub b{color:#FFFFFF}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:20px;color:#8DA2C0;letter-spacing:.02em}
.glass{
  position:absolute;top:44px;right:78px;
  font-weight:900;font-size:96px;letter-spacing:.02em;line-height:1;
  background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.10) 55%,rgba(255,255,255,.30) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:1px rgba(205,235,255,.45);
}
.glass sup{
  font-size:.52em;vertical-align:.5em;
  background:linear-gradient(180deg,rgba(140,243,223,.9),rgba(94,234,212,.4));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:1px rgba(94,234,212,.75);
}
</style>
</head>
<body>
<div class="glass">AID30<sup>+</sup></div>
<div class="wrap">
  <img class="logo" src="img/logo-kaywon-inv.png" alt="계원예술대학교 평생교육원 수신재">
  <div>
    <h1>
      <span class="u">계원예술대학교</span>
      <span class="p">재직자 AID30+ 집중과정</span>
    </h1>
    <p class="sub"><b>작품 전시관</b> — 일하면서 만들었습니다</p>
  </div>
  <div class="foot">
    <span>교육부 · 국가평생교육진흥원 지원</span>
    <span>AI·D 30+ INTENSIVE CAMP</span>
  </div>
</div>
</body>
</html>
